<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%220.9em%22 font-size=%2290%22>◈</text></svg>'>
<title>访客协议 VISITOR PROTOCOL · 管理后台</title>
<style>
html,body{overscroll-behavior:none}
button,[role=button]{touch-action:manipulation}
button:active,[role=button]:active{filter:brightness(.9)}
@media(hover:hover) and (pointer:fine){
.ph:hover::before{box-shadow:0 0 0 1px var(--acc),0 0 14px rgba(255,177,0,.6)}
.btn:hover{border-color:rgba(255,177,0,.55)}
.btn.danger:hover{border-color:var(--bad);box-shadow:0 0 0 1px rgba(255,82,82,.25) inset}
.gate:hover{border-color:var(--line2)}
.nav button:hover{background:rgba(255,255,255,.035);color:var(--ink)}
.tabs button:hover{border-color:var(--line2);color:var(--ink)}
}

:root{
  /* 基础面（docs/worldbible.md 7.1） */
  --bg:#0b0e11;--bg-deep:#0d1217;--bg-line:#0e1318;
  --surface-1:#12171d;--surface-2:#161c23;--surface-3:#161d24;
  --tile:#1a2129;--tile-alt:#20272f;
  /* 描边 */
  --line:#28313b;--line2:#3a4550;
  /* 文字 */
  --ink:#d9e0e7;--dim:#8a96a2;--mute:#5a6772;
  /* 语义色 */
  --acc:#ffb100;--on:#ffcb4a;--warn:#ff8f5e;--bad:#ff5252;--ok:#3ddc8f;--cy:#39d0e0;
  /* 危险条 */
  --hazard-a:#ffb100;--hazard-b:#141414;
  /* 字体（7.2） */
  --font-ui:'Segoe UI',system-ui,'Microsoft YaHei',sans-serif;
  --font-mono:ui-monospace,Consolas,'Courier New',monospace;
  /* 既有页面沿用的别名 */
  --mono:var(--font-mono);
  /* 难度分档色（V1→V5 冷→暖） */
  --d1:#3ddc8f;--d2:#39d0e0;--d3:#ffcb4a;--d4:#ff8f5e;--d5:#ff5252;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(1000px 520px at 75% -10%,rgba(255,177,0,.07),transparent 60%),var(--bg);
  color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.65;letter-spacing:.04em;-webkit-tap-highlight-color:transparent}
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:42px 42px;
  -webkit-mask-image:radial-gradient(ellipse at center,black 25%,transparent 78%);mask-image:radial-gradient(ellipse at center,black 25%,transparent 78%)}
.bg-scan{position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}.mute{color:var(--mute)}
.small{font-size:11.5px}.tiny{font-size:10.5px;letter-spacing:.08em}
.up{text-transform:uppercase;letter-spacing:.08em}
.hazard{height:8px;border-radius:4px;opacity:.85;
  background:repeating-linear-gradient(45deg,var(--hazard-a) 0 12px,var(--hazard-b) 12px 24px)}
.hazard.thin{height:6px}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
.btn{min-height:44px;padding:9px 16px;border:1px solid var(--line2);border-radius:8px;background:linear-gradient(180deg,var(--surface-2),var(--surface-1));
  color:var(--ink);font-size:13px;transition:border-color .15s,box-shadow .15s,transform .1s;touch-action:manipulation}

.btn:active{transform:translateY(1px)}
.btn.pri{border-color:transparent;background:linear-gradient(180deg,#ffc23d,#f5a300);color:#1a1200;font-weight:700;letter-spacing:.18em}
.btn.danger{border-color:rgba(255,82,82,.55);color:var(--bad)}

.btn.sm{min-height:34px;padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.inp,select.inp,textarea.inp{width:100%;background:var(--bg-line);border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  color:var(--ink);font-size:13.5px;outline:none;transition:border-color .15s;min-height:44px}
.inp:focus{border-color:rgba(255,177,0,.6)}
textarea.inp{min-height:62px;resize:vertical;line-height:1.6}
label.fld{display:block;margin:0 0 12px}
label.fld>span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px;letter-spacing:.1em}
.card{background:linear-gradient(180deg,var(--surface-2),var(--surface-1));border:1px solid var(--line);border-radius:12px}
.frame{position:relative}
.frame::after{content:"";position:absolute;inset:6px;border:1px dashed rgba(255,177,0,.16);border-radius:10px;pointer-events:none}
/* ---------- 登录 ---------- */
#loginView{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 12px}
.loginCard{width:min(94vw,400px);overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.lbrand{display:flex;gap:12px;align-items:center;padding:18px 22px 6px}
.logo{width:42px;height:42px;flex:0 0 auto;border:1px solid var(--acc);border-radius:8px;display:grid;place-items:center;color:var(--acc);font-size:20px;box-shadow:inset 0 0 12px rgba(255,177,0,.25)}
.lbrand h1{font-size:16px;letter-spacing:.14em}
.lbrand p{font-size:10.5px;margin-top:3px;letter-spacing:.1em}
.loginBody{padding:8px 22px 22px}
.msg{font-size:12.5px;margin-top:10px;min-height:18px;color:var(--bad)}
.msg.ok{color:var(--ok)}
.msg.hint{color:var(--dim)}
.gate{margin-top:16px;display:flex;align-items:center;gap:10px;background:var(--bg-line);border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;user-select:none;transition:border-color .15s}

.gate.ok{border-color:rgba(61,220,143,.55);cursor:default}
.gate .cb{flex:0 0 auto;width:22px;height:22px;border:2px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-size:14px;color:transparent}
.gate.ok .cb{border-color:var(--ok);color:var(--ok)}
.gate .cb.spin{border-radius:50%;border-color:var(--acc) transparent var(--acc) transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gate b{font-size:13px;font-weight:600}
.gate .gs{font-size:10.5px;color:var(--dim);letter-spacing:.08em;margin-top:2px}
#loginBtn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:8px;background:linear-gradient(180deg,#ffc23d,#f5a300);color:#1a1200;
  font-weight:700;letter-spacing:.3em;font-size:14px;opacity:.4;cursor:not-allowed;transition:all .2s}
#loginBtn:not(:disabled){cursor:pointer;opacity:1;box-shadow:0 6px 18px rgba(255,177,0,.22)}
/* ---------- 应用外壳 ---------- */
#appView{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:216px 1fr}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--surface-2),#0f141a);border-right:1px solid var(--line)}
.sidehead{flex:0 0 auto}
.sidefoot{flex:0 0 auto}
.sidehead{padding:16px 16px 12px;display:flex;gap:10px;align-items:center}
.sidehead .logo{width:34px;height:34px;font-size:16px}
.sidehead h2{font-size:13px;letter-spacing:.14em}
.sidehead p{font-size:9.5px;color:var(--dim);letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 8px;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.nav button{display:flex;align-items:center;gap:9px;min-height:44px;padding:8px 12px;border-radius:8px;border-left:2px solid transparent;
  color:var(--dim);font-size:13.5px;text-align:left;transition:all .15s;white-space:nowrap}
.nav button .ic{font-size:14px;opacity:.85}

.nav button.on{background:linear-gradient(90deg,rgba(255,177,0,.16),transparent);border-left-color:var(--acc);color:var(--on)}
.nav .sep{height:1px;background:var(--line);margin:6px 12px}
.sidefoot{padding:10px 12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mute)}
.sidefoot .who{color:var(--dim);font-size:12px;margin-bottom:8px;word-break:break-all}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(11,14,17,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 20px 10px}
.topbar .t1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.topbar h2{font-size:16px;letter-spacing:.14em}
.topbar .t2{font-size:11.5px;color:var(--dim);margin-top:2px}
.content{padding:18px 20px 60px;display:flex;flex-direction:column;gap:16px;max-width:1180px}
.sec{padding:15px 16px 16px}
.sec>h3{font-size:13.5px;letter-spacing:.14em;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h3::before{content:"";width:3px;height:15px;background:var(--acc);border-radius:2px;flex:0 0 auto}
.sec>p.desc{font-size:11.5px;color:var(--dim);margin:6px 0 12px;line-height:1.7}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.gridk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,var(--surface-3),var(--surface-1))}
.kpi .k{font-size:10.5px;color:var(--dim);letter-spacing:.1em}
.kpi .v{font-family:var(--font-mono);font-size:22px;color:var(--on);margin-top:5px;line-height:1.25}
.kpi .v.s{font-size:15px}
.kpi .u{font-size:11px;color:var(--mute);margin-left:3px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;color:var(--dim);letter-spacing:.1em;background:var(--bg-deep);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(odd){background:rgba(255,255,255,.014)}
td.num{font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-family:var(--font-mono);font-size:10.5px;padding:2px 6px;border-radius:4px;border:1px solid var(--line2);color:var(--dim);letter-spacing:.06em}
.tag.ok{color:var(--ok);border-color:rgba(61,220,143,.5)}
.tag.bad{color:var(--bad);border-color:rgba(255,82,82,.5)}
.tag.acc{color:var(--acc);border-color:rgba(255,177,0,.45)}
.probar{height:6px;border-radius:3px;background:var(--tile-alt);overflow:hidden}
.probar>i{display:block;height:100%;background:linear-gradient(90deg,#3ddc8f,#9df3c6);width:var(--p,99.7%);transition:width .6s cubic-bezier(.2,.7,.3,1)}
.probar.low>i{background:linear-gradient(90deg,#ff5252,#ff8f5e)}
.bar{height:5px;border-radius:3px;background:var(--tile-alt);overflow:hidden;min-width:52px}
.bar>i{display:block;height:100%;background:var(--acc)}
.bar.d1>i{background:var(--d1)}.bar.d2>i{background:var(--d2)}.bar.d3>i{background:var(--d3)}.bar.d4>i{background:var(--d4)}.bar.d5>i{background:var(--d5)}
/* ---------- 概率条 ---------- */
.pbar-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.pbar-sum{font-family:var(--font-mono);font-size:12px;color:var(--dim)}
.pbar-sum b{color:var(--ok);font-size:14px}
.pbar-sum.err b{color:var(--bad)}
.pbar-sum.err{color:var(--bad)}
.distbox{position:relative;padding:22px 10px 26px}
.distbox::before{content:"拖动 ▽ 手柄调整各段宽度";position:absolute;top:0;left:50%;transform:translateX(-50%);
  font-size:10.5px;color:var(--mute);letter-spacing:.1em;white-space:nowrap}
.pbar{position:relative;display:flex;height:46px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--bg-deep);touch-action:none;-webkit-user-select:none;user-select:none}
.pseg{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:flex-basis .18s cubic-bezier(.2,.7,.3,1);border-right:1px solid rgba(0,0,0,.45);cursor:default}
.pseg:last-child{border-right:0}
.pseg .lab{font-size:11px;color:#0b0e11;font-weight:700;letter-spacing:.04em;white-space:nowrap;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.18)}
.pseg.dragging{transition:none}
.pseg.s1{background:linear-gradient(180deg,var(--d1),#2aa86b)}
.pseg.s2{background:linear-gradient(180deg,var(--d2),#28a3b1)}
.pseg.s3{background:linear-gradient(180deg,var(--d3),#d9a300)}
.pseg.s4{background:linear-gradient(180deg,var(--d4),#d97448)}
.pseg.s5{background:linear-gradient(180deg,var(--d5),#cc3b3b)}
.ph{position:absolute;top:50%;transform:translate(-50%,-50%);width:26px;height:calc(100% + 14px);z-index:4;
  display:grid;place-items:center;cursor:grab;touch-action:none}
.ph::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:rgba(11,14,17,.85);
  box-shadow:0 0 0 1px rgba(255,177,0,.55),0 0 10px rgba(255,177,0,.35);border-radius:2px}
.ph::after{content:"⋮";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;line-height:1;
  color:var(--acc);background:var(--surface-1);border:1px solid rgba(255,177,0,.6);border-radius:6px;width:20px;height:26px;
  display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.7)}
.ph.act::before{box-shadow:0 0 0 1px var(--acc),0 0 14px rgba(255,177,0,.6)}
.ph:active{cursor:grabbing}
.axis{position:relative;height:16px;margin-top:3px}
.axis i{position:absolute;top:0;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--mute);font-family:var(--font-mono)}
.leg{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.leg .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px}
.leg .sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.leg .li b{color:var(--ink);font-family:var(--font-mono)}
/* ---------- 关卡管理 ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{min-height:38px;padding:7px 14px;border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:12.5px;transition:all .15s}

.tabs button.on{border-color:rgba(255,177,0,.6);color:var(--on);background:rgba(255,177,0,.1)}
.tabs button .n{font-family:var(--font-mono);font-size:10.5px;opacity:.75;margin-left:4px}
.lvl{padding:12px 13px;display:flex;flex-direction:column;gap:10px}
.lvl .lhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl .lhead .id{font-family:var(--font-mono);font-size:11px;color:var(--cy)}
.lvl .lk{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.lvl .lk label{display:block}
.lvl .lk label>span{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.1em;margin-bottom:4px}
.lvl .lk .inp{min-height:38px;padding:7px 10px;font-size:12.5px}
.sw{position:relative;width:46px;height:26px;flex:0 0 auto;border-radius:999px;background:var(--tile-alt);border:1px solid var(--line2);transition:all .18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:all .18s}
.sw.on{background:rgba(61,220,143,.18);border-color:rgba(61,220,143,.6)}
.sw.on::after{left:22px;background:var(--ok);box-shadow:0 0 10px rgba(61,220,143,.6)}
.ovr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ovr .oc{display:flex;flex-direction:column;gap:4px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 4px;background:var(--bg-deep)}
.ovr .oc .ol{font-size:10px;color:var(--dim);letter-spacing:.06em}
.ovr .oc input[type=range]{width:100%;accent-color:var(--acc);height:22px;touch-action:pan-y}
.ovr .oc input[type=number]{width:100%;background:var(--bg-line);border:1px solid var(--line);border-radius:6px;padding:3px 5px;font-family:var(--font-mono);font-size:11.5px;text-align:center;min-height:30px}
.errline{font-size:11.5px;color:var(--bad);min-height:16px;margin-top:6px;word-break:break-all}
.errline.ok{color:var(--ok)}
.drop{border:1px dashed var(--line2);border-radius:10px;padding:12px;background:var(--bg-deep)}
/* ---------- 统计 ---------- */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.chart{padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,var(--surface-3),var(--surface-1))}
.chart h4{font-size:12px;letter-spacing:.1em;color:var(--ink);margin-bottom:2px}
.chart p.cd{font-size:10.5px;color:var(--mute);margin-bottom:8px;letter-spacing:.06em}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--tile);display:block;border:1px solid rgba(255,255,255,.03)}
.heat i.l1{background:#2a4a34}.heat i.l2{background:#2f7a4c}.heat i.l3{background:#3ddc8f}.heat i.l4{background:#9df3c6}
/* ---------- 危险区 ---------- */
.danger{border:1px solid rgba(255,82,82,.35);background:linear-gradient(180deg,rgba(255,82,82,.05),transparent),linear-gradient(180deg,var(--surface-2),var(--surface-1))}
.danger>h3::before{background:var(--bad)}
/* ---------- toast / 遮罩 ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;background:var(--surface-3);border:1px solid var(--ok);
  border-radius:8px;padding:10px 18px;font-size:13px;animation:fade .2s;max-width:min(92vw,420px);text-align:center}
.toast.bad{border-color:var(--bad)}
@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}}
.mask{position:fixed;inset:0;background:rgba(5,7,9,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{width:min(94vw,560px);max-height:92vh;overflow:auto;border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.72);
  background:linear-gradient(180deg,var(--surface-2),#10151b)}
.modal .mh{padding:14px 18px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal .mh h3{font-size:15px;letter-spacing:.12em}
.modal .mb{padding:12px 18px 18px}
.modal .mf{padding:0 18px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.term{font-family:var(--font-mono);font-size:12px;line-height:1.75;color:var(--dim);padding-left:1.2em;text-indent:-1.2em}
.term::before{content:"> ";color:var(--acc)}
.term b{color:var(--ink);font-weight:600}
/* ---------- 多端适配（7.6） ---------- */
@media (max-width:640px){
  .hazard{height:6px}
  #appView{grid-template-columns:1fr}
  .side{position:sticky;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .sidehead{padding:10px 12px 6px}
  .sidehead .logo{width:28px;height:28px;font-size:14px}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding:6px 10px 8px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{min-height:40px;padding:7px 12px;border-left:0;border-bottom:2px solid transparent;font-size:12.5px;flex:0 0 auto}
  .nav button.on{background:rgba(255,177,0,.12);border-left-color:transparent;border-bottom-color:var(--acc)}
  .nav .sep{display:none}
  .nav button .ic{font-size:13px}
  .sidefoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px}
  .sidefoot .who{margin-bottom:0;font-size:11.5px}
  .topbar{padding:10px 12px 8px}
  .topbar h2{font-size:14.5px}

function rangeStart(id) {
  var d = new Date();
  if (id === 'today') return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (id === 'week') {
    // 周一为一周之始
    var wd = (d.getDay() + 6) % 7;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() - wd);
  }
  if (id === 'month') return new Date(d.getFullYear(), d.getMonth(), 1);
  if (id === 'year') return new Date(d.getFullYear(), 0, 1);
  return null;
}
function inRange(ts, id) {
  var d = parseTs(ts);
  if (!d) return false;
  var s = rangeStart(id);
  if (!s) return true;
  return d.getTime() >= s.getTime();
}

function downloadJson(name, obj) {
  var text = JSON.stringify(obj, null, 2);

    var a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) { /* 忽略 */ }
    }, 1500);
    console.log('[ADMIN] 已触发下载：' + name + '（' + blob.size + ' bytes）');
    toast('已触发下载：' + name);
    return { name: name, bytes: blob.size, url: url };
  } catch (e) {
    console.error('[ADMIN] 导出失败：' + e.message);
    toast('导出失败：' + e.message, true);
    return null;
  }
}

}

        buttons: [{ label: '放弃' }, { label: '执行', cls: 'danger', onClick: function () { run(); } }]
      });
    /* 第二段模态已由 showModal 替换打开；这里必须返回 true，否则外层处理器会立刻 closeModal() 把它关掉，导致「执行」永远点不到（已实测） */
    return true;
    } }]
  });
}

/* =========================================================================
   渲染与路由
   ========================================================================= */
var RENDERERS = { status: renderStatus, diff: renderDiff, levels: renderLevels, acct: renderAcct, stats: renderStats, adv: renderAdv };
var rendered = {};
function rerender() {
  var root = $('#content');
  var pg = PAGE;
  var def = null;
  PAGES.forEach(function (p) { if (p.id === pg) def = p; });
  if (!def) { PAGE = pg = 'status'; def = PAGES[0]; }
  $('#pgTitle').textContent = def.name;
  $('#pgCode').textContent = def.code;
  $('#pgSub').textContent = def.sub;
  root.innerHTML = '';
  try {
    RENDERERS[pg](root);
    rendered[pg] = true;
  } catch (e) {
    rendered[pg] = false;
    console.error('[ADMIN] 渲染菜单「' + def.name + '」失败：', e);
    var box = el('div', 'card sec danger');
    box.appendChild(el('h3', null, '渲染异常'));
    var pre = el('pre', 'small mono');
    pre.style.cssText = 'white-space:pre-wrap;color:var(--bad)';
    pre.textContent = String(e && e.stack ? e.stack : e);
    box.appendChild(pre);
    var b = el('button', 'btn');
    b.textContent = '重试';
    b.addEventListener('click', rerender);
    box.appendChild(b);
    root.appendChild(box);
  }
  syncNav();
  painted[pg] = true;
  console.log('[ADMIN-TEST] render menu=' + pg + ' ok=' + rendered[pg] + ' nodes=' + root.querySelectorAll('*').length);
}
var painted = {};
function syncNav() {
  $$('#nav button').forEach(function (b) {
    var on = b.getAttribute('data-page') === PAGE;
    b.className = on ? 'on' : '';
    b.setAttribute('aria-selected', String(on));
  });
}
function buildNav() {
  var nav = $('#nav');
  nav.innerHTML = '';
  PAGES.forEach(function (p, i) {
    if (p.id === 'acct') { var s = el('div', 'sep'); nav.appendChild(s); }
    var b = el('button', '', p.name);
    b.setAttribute('data-page', p.id);
    b.setAttribute('role', 'tab');
    var ic = el('span', 'ic', p.icon);
    b.appendChild(ic);
    b.appendChild(document.createTextNode(p.name));
    b.addEventListener('click', function () {
      PAGE = p.id;
      rerender();
      if (window.matchMedia('(max-width:640px)').matches) window.scrollTo(0, 0);
    });
    nav.appendChild(b);
  });
}

/* =========================================================================
   自检样例数据（?selftest=1）
   ========================================================================= */
function seedSample() {
  var now = new Date(), t0 = now.getTime();
  var stats = [], matchlog = [], visits = {};
  var games = ['circuit', 'packing', 'gems', 'camping', 'lights', 'code', 'nonogram', 'targets', 'sliding'];
  var devices = ['V-40053', 'V-40054', 'V-40056', 'V-40055', 'V-40057', 'V-40058', 'V-40059', 'V-40060', 'V-40061'];
  var rnd = (function (a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })(20260214);
  var i;
  for (i = 0; i < 30; i++) {
    var gi = i % games.length, lv = (i % 5) + 1;
    var pass = rnd() > 0.28;
    var ts = new Date(t0 - Math.floor(rnd() * 1000 * 60 * 60 * 9));
    stats.push({
      ts: ts.toISOString(), device: devices[gi], game: games[gi], lv: lv,
      stars: pass ? 1 + Math.floor(rnd() * 3) : 0,
      moves: 4 + Math.floor(rnd() * 26), secs: 12 + Math.floor(rnd() * 180),
      pass: pass
    });
  }
  for (i = 0; i < 30; i++) {
    var gi2 = i % games.length, lv2 = (i % 5) + 1;
    matchlog.push({ ts: new Date(t0 - Math.floor(rnd() * 1000 * 60 * 60 * 9)).toISOString(), game: games[gi2], id: games[gi2] + '-' + (i + 1), lv: lv2 });
  }
  /* 造跨日历史，便于「统计」页时间范围与热力图有数据 */
  for (i = 1; i <= 70; i++) {
    if (rnd() > 0.55) continue;
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i, 10 + (i % 9), 30);
    var gg = games[i % games.length], ll = (i % 5) + 1, ps = rnd() > 0.3;
    stats.push({ ts: d.toISOString(), device: devices[i % devices.length], game: gg, lv: ll, stars: ps ? 1 + Math.floor(rnd() * 3) : 0, moves: 5 + Math.floor(rnd() * 24), secs: 15 + Math.floor(rnd() * 150), pass: ps });
    matchlog.push({ ts: d.toISOString(), game: gg, id: gg + '-h' + i, lv: ll });
  }
  for (i = 0; i < 21; i++) {
    var d2 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    visits[ymd(d2)] = 3 + Math.floor(rnd() * 60);
  }
  lsSet(LS.stats, stats);
  lsSet(LS.matchlog, matchlog);
  CFG.visitByDate = visits;
  /* 示例数据只填充 visitByDate；概率条 / 关卡覆盖 / redirect 若已存在则原样保留，
     否则自检刷新会覆盖用户在「难度」页保存的配置。 */
  if (!lsGet(LS.cfg, null)) {
    CFG.globalDist = [34, 26, 20, 13, 7];
    CFG.levelDist = { circuit: { '3': [20, 30, 40, 20, 10], '5': [5, 10, 20, 40, 60] }, gems: { '4': [10, 10, 30, 40, 20] } };
    CFG.redirect = CFG.redirect || DEF_REDIRECT;
  }
  GLOBAL = CFG.globalDist.slice();
  lsSet(LS.cfg, CFG);
  if (!lsGet(LS.user, null)) lsSet(LS.user, { name: '访客-自检', id: 'u-selftest', created: new Date().toISOString() });
  /* 仅在没有凭据时写入默认值：自检不应覆盖用户已修改的密码（否则改密后刷新即失效） */
  if (!lsGet(LS.cred, null)) lsSet(LS.cred, { user: CRED_DEFAULT.user, pass: CRED_DEFAULT.pass });
  console.log('[ADMIN-TEST] seeded stats=' + stats.length + ' matchlog=' + matchlog.length + ' todayStats=' + todayStats().length + ' todayMatch=' + todayMatch().length);
}
function runSelfTest() {
  console.log('[ADMIN-TEST] ===== 管理后台自检开始 =====');
  seedSample();
  /* 走一遍渲染（隐藏容器） */
  var holder = el('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;width:1100px';
  document.body.appendChild(holder);
  var origContent = $('#content');
  var marks = {};
  ['status', 'diff', 'levels', 'acct', 'stats', 'adv'].forEach(function (id) {
    holder.innerHTML = '';
    var fake = el('div');
    holder.appendChild(fake);
    var ok = true, err = null;
    try { RENDERERS[id](fake); } catch (e) { ok = false; err = e; }
    marks[id] = { ok: ok, nodes: fake.querySelectorAll('*').length, svg: fake.querySelectorAll('svg').length, tables: fake.querySelectorAll('table').length, err: err ? String(err.message || err) : null };
    console.log('[ADMIN-TEST] menu=' + id + ' ok=' + ok + ' nodes=' + marks[id].nodes + ' svg=' + marks[id].svg + ' tables=' + marks[id].tables + (err ? ' ERR=' + err.message : ''));
  });
  holder.remove();
  /* 概率条拖动模拟：等价于把手柄拖到 x% */
  var before = GLOBAL.slice();
  var t2 = [31.5, 22.5, 20, 16, 10];
  GLOBAL = widthsToDist(t2);
  var sumAfter = sumDist(GLOBAL);
  GLOBAL = before.slice();
  console.log('[ADMIN-TEST] dist Σ=100 check: ' + JSON.stringify(t2) + ' → Σ=' + sumAfter + ' ok=' + (Math.abs(sumAfter - 100) <= EPS));
  /* 校验器 */
  var g1 = validateLevel({ game: 'gems', lv: 2, hand: { start: [0, 0], goal: [6, 6], gems: [[2, 0], [0, 2]] } }, 'gems');
  var g2 = validateLevel({ game: 'gems', lv: 9, name: 'bad' }, 'gems');
  var g3 = validateLevel({ game: 'circuit', lv: 3, params: { n: 5, leaves: [4, 6] } }, 'circuit');
  console.log('[ADMIN-TEST] validate legal(gems)=' + g1.ok + ' illegal=' + g2.ok + ' errs=' + JSON.stringify(g2.errs) + ' legal(circuit)=' + g3.ok);
  console.log('[ADMIN-TEST] rendered menus: ' + JSON.stringify(marks));
  console.log('[ADMIN-TEST] ===== 自检结束 =====');
  window.__adminTest = marks;
}

/* =========================================================================
   登录
   ========================================================================= */
var gate = { state: 'idle', armed: false, timer: null };
function gateReset() {
  gate.state = 'idle'; gate.armed = false;
  if (gate.timer) { clearTimeout(gate.timer); gate.timer = null; }
  var g = $('#lgGate'), cb = $('#lgCb');
  if (!g) return;
  g.className = 'gate'; cb.className = 'cb';
  g.setAttribute('aria-checked', 'false');
  $('#lgGateSub').textContent = 'HUMAN VERIFICATION REQUIRED';
  g.querySelector('b').textContent = '我是人类';
  updateLoginBtn();
}
function gateRun() {
  if (gate.armed || gate.state === 'checking' || gate.state === 'ok') return;
  gate.armed = true; gate.state = 'checking';
  var g = $('#lgGate'), cb = $('#lgCb');
  cb.className = 'cb spin';
  $('#lgGateSub').textContent = '正在核验身份特征 …';
  g.querySelector('b').textContent = '核验中';
  updateLoginBtn();
  var ms = (typeof window.__adminTest === 'object') ? 120 : 900;
  gate.timer = setTimeout(function () {
    gate.timer = null;
    if (gate.state !== 'checking') return;
    gate.state = 'ok';
    g.className = 'gate ok';
    cb.className = 'cb';
    g.setAttribute('aria-checked', 'true');
    $('#lgGateSub').textContent = 'HUMAN VERIFIED · 人类身份已确认';
    g.querySelector('b').textContent = '人类身份已确认';
    updateLoginBtn();
  }, ms);
}
function updateLoginBtn() {
  var b = $('#loginBtn');
  if (b) b.disabled = !(gate.state === 'ok');
}
function initLogin() {
  var cred = loadCred();
  $('#lgUser').value = cred.user;
  $('#lgPass').value = '';
  gateReset();
  $('#lgMsg').className = 'msg hint';
  $('#lgMsg').textContent = '请完成人机验证后登录。';
  var g = $('#lgGate');
  g.addEventListener('click', gateRun);
  g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); gateRun(); } });
  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var c = loadCred();
    var u = $('#lgUser').value.trim(), p = $('#lgPass').value;
    if (gate.state !== 'ok') { fail('请先完成人机验证'); return; }
    if (u !== c.user || p !== c.pass) {
      fail('帐号或密码错误');
      var box = $('#loginBtn');
      box.animate ? box.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 220 }) : 0;
      console.log('[ADMIN-TEST] login fail user=' + u);
      return;
    }
    ssSet(LS.session, { user: c.user, at: new Date().toISOString(), token: Math.random().toString(36).slice(2, 10) });
    console.log('[ADMIN-TEST] login ok user=' + c.user);
    enterApp();
  });
  function fail(t) { var m = $('#lgMsg'); m.className = 'msg'; m.textContent = t; }
}
/* 侧栏「退出登录」只在 boot 绑一次，避免重入 boot 时重复挂载监听 */
function bindLogout() {
  var b = $('#logoutBtn');
  if (b && !b.__bound) { b.__bound = true; b.addEventListener('click', doLogout); }
}
function doLogout() {
  ssDel(LS.session);
  console.log('[ADMIN-TEST] logout');
  boot();
}
function enterApp() {
  $('#loginView').hidden = true;
  $('#appView').hidden = false;
  $('#whoUser').textContent = loadCred().user;
  if (gate.timer) { clearTimeout(gate.timer); gate.timer = null; }
  rerender();
}

/* =========================================================================
   启动
   ========================================================================= */
function boot() {
  var qs = new URLSearchParams(location.search);
  var selftest = qs.get('selftest') === '1';
  if (selftest) window.__adminTest = {};
  CFG = loadCfg();
  loadCred();
  if (selftest) seedSample();
  CFG = loadCfg(); GLOBAL = CFG.globalDist.slice();

  var pause = qs.get('pause') === '1';
  var sess = pause ? null : ssGet(LS.session, null);
  /* 回到未登录视图：显示登录页、隐藏控制台（退出登录复用 boot，必须双向复位） */
  $('#appView').hidden = true;
  $('#loginView').hidden = false;
  $('#content').innerHTML = '';
  buildNav();
  initLogin();
  bindLogout();
  if (pause) console.log('[ADMIN-TEST] pause=1：停留登录界面，等待真实登录流程');
  if (sess && sess.user) {
    $('#lgUser').value = sess.user;
    $('#lgPass').value = loadCred().pass;
    gateRun();
    gate.state = 'ok'; gate.armed = true;
    var g = $('#lgGate');
    g.className = 'gate ok';
    $('#lgCb').className = 'cb';
    g.setAttribute('aria-checked', 'true');
    $('#lgGateSub').textContent = 'HUMAN VERIFIED · 会话内已核验';
    g.querySelector('b').textContent = '人类身份已确认';
    updateLoginBtn();
    console.log('[ADMIN-TEST] session resumed user=' + sess.user);
    enterApp();
  }
  if (selftest) {
    setTimeout(function () {
      runSelfTest();
      var a = ssGet(LS.session, null);
      if (!a) {
        console.warn('[ADMIN-TEST] 无人机验证会话记录：登录门禁未走完（自检耗时 < 1 秒属预期）。需要走完整登录流程请用 admin.html?selftest=1&pause=1。');
      }
    }, 1300);
  }
  console.log('[ADMIN-TEST] boot selftest=' + selftest + ' pages=' + PAGES.length + ' games=' + GAMES.length + ' protocol=' + location.protocol);
}
document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();
</script>
