<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%220.9em%22 font-size=%2290%22>◈</text></svg>'>
<meta name="theme-color" content="#0b0e11">
<title>访客协议 VISITOR PROTOCOL · 源石电路维修</title>
<style>
html{-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
button,a,[role=button]{touch-action:manipulation}
button:active,a:active,[role=button]:active{filter:brightness(.9)}
@media(hover:hover) and (pointer:fine){
.captcha-box:hover{border-color:var(--line2)}
.tile.rot:hover{border-color:rgba(255,177,0,.55)}
.ghost:hover{border-color:var(--acc);color:var(--acc)}
}

:root{--bg:#0b0e11;--line:#28313b;--line2:#3a4550;--ink:#d9e0e7;--dim:#8a96a2;--acc:#ffb100;--on:#ffcb4a;--ok:#3ddc8f;--mono:ui-monospace,Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1000px 520px at 75% -10%,rgba(255,177,0,.07),transparent 60%),var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,'Microsoft YaHei',sans-serif;overflow-x:hidden;padding:24px 12px}
.bg{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:42px 42px;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at center,black 25%,transparent 78%);mask-image:radial-gradient(ellipse at center,black 25%,transparent 78%)}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.frame{position:relative}
.frame::after{content:"";position:absolute;inset:6px;border:1px dashed rgba(255,177,0,.16);border-radius:10px;pointer-events:none}
.card{width:min(92vw,400px);background:linear-gradient(180deg,#161c23,#12171d);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
.hazard{height:8px;background:repeating-linear-gradient(45deg,var(--acc) 0 12px,#141414 12px 24px);opacity:.85}
.brand{display:flex;gap:12px;align-items:center;padding:18px 22px 6px}
.logo{width:40px;height:40px;border:1px solid var(--acc);border-radius:8px;display:grid;place-items:center;color:var(--acc);font-size:20px;box-shadow:inset 0 0 12px rgba(255,177,0,.25)}
.brand h1{font-size:17px;letter-spacing:.14em}
.brand p{font-size:10.5px;margin-top:3px;letter-spacing:.08em}
form{padding:10px 22px 22px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:.1em}
.field input{width:100%;background:#0e1318;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font-size:14px;outline:none}
.captcha-box{margin:16px 0 12px;display:flex;align-items:center;gap:12px;background:#0e1318;border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;user-select:none;transition:border-color .15s}

.captcha-box.ok{border-color:rgba(61,220,143,.55);cursor:default}
.cb{flex:0 0 auto;width:22px;height:22px;border:2px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-size:14px;color:transparent}
.captcha-box.ok .cb{border-color:var(--ok);color:var(--ok)}
.cb.spin{border-radius:50%;border-color:var(--acc) transparent var(--acc) transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loginBtn{width:100%;padding:12px;border:0;border-radius:8px;background:linear-gradient(180deg,#ffc23d,#f5a300);color:#1a1200;font-weight:700;letter-spacing:.3em;font-size:14px;cursor:not-allowed;opacity:.4;transition:all .2s}
#loginBtn:not(:disabled){cursor:pointer;opacity:1;box-shadow:0 6px 18px rgba(255,177,0,.22)}
.note{font-size:12px;margin-top:10px}
.credit{margin-top:14px;font-size:11px;color:var(--dim);opacity:.7;text-align:center;max-width:420px}
.mask{position:fixed;inset:0;background:rgba(5,7,9,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;animation:fade .2s}
.modal{width:min(94vw,520px);background:linear-gradient(180deg,#161c23,#10151b);border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 20px 2px;gap:10px}
.mhead h2{font-size:16px;letter-spacing:.1em}
.mhead h2 span{font-size:11px;letter-spacing:.06em}
.sub{font-size:11px;margin-top:4px}
.status{flex:0 0 auto;font-size:11px;color:var(--acc);border:1px solid rgba(255,177,0,.4);padding:4px 8px;border-radius:4px}
.status.pass{color:var(--ok);border-color:rgba(61,220,143,.5)}
.mtip{padding:8px 20px 0;font-size:12.5px;color:var(--dim);line-height:1.65}
.mtip b{color:var(--ink)}
.grid-wrap{padding:14px 20px 4px;display:flex;justify-content:center}
.grid{--n:4;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;width:min(76vw,380px);background:#0d1217;border:1px solid var(--line);border-radius:10px;padding:10px}
.tile{position:relative;aspect-ratio:1;background:#1a2129;border:1px solid #262f38;border-radius:8px;transition:border-color .15s;touch-action:manipulation}
.tile.rot{cursor:pointer}

.tile.fixed{cursor:default;background:#161d24}
.tile svg{position:absolute;inset:6%;width:88%;height:88%;transform:rotate(var(--r,0deg));transition:transform .18s cubic-bezier(.2,.7,.3,1.15)}
.pipe{stroke:#5a6772;stroke-width:15;stroke-linecap:round;transition:stroke .18s,filter .18s}
.center{fill:#2a333d;stroke:#5a6772;stroke-width:4;transition:all .18s}
.tile.powered .pipe{stroke:var(--on);filter:drop-shadow(0 0 6px rgba(255,177,0,.85));animation:pulseGlow 1.8s ease-in-out .15s infinite}
.tile.just-on .pipe{animation:powerIn .34s ease-out calc(var(--d,0)*55ms) backwards,pulseGlow 1.8s ease-in-out infinite}
.flow{stroke:#fff6d8;stroke-width:5;stroke-linecap:round;stroke-dasharray:9 15;opacity:0;transition:opacity .25s}
.tile.powered .flow{opacity:.9;animation:flowMove .8s linear infinite}
.tile.powered .center{fill:var(--on);stroke:var(--on)}
.core{fill:#10151a;stroke:#5a6772;stroke-width:4;transition:all .18s}
.bolt{fill:#5a6772;transition:fill .18s}
.tile.powered .core{stroke:var(--on);filter:drop-shadow(0 0 8px rgba(255,177,0,.8))}
.tile.powered .bolt{fill:var(--on)}
.lamp-ring{fill:none;stroke:#5a6772;stroke-width:4;stroke-dasharray:6 5;transition:stroke .18s}
.bulb{fill:#20262d;stroke:#5a6772;stroke-width:4;transition:all .18s}
.tile.powered .bulb{fill:var(--on);stroke:var(--on);filter:drop-shadow(0 0 10px rgba(255,177,0,.95))}
.tile.powered .lamp-ring{stroke:rgba(255,203,74,.6);animation:ringPulse 2s ease-in-out infinite}
.tile .bulb,.tile .burst{transform-box:fill-box;transform-origin:center}
.tile.just-on .bulb{animation:bulbIn .45s cubic-bezier(.2,1.6,.4,1) backwards calc(var(--d,0)*55ms + .12s)}
.burst{fill:none;stroke:var(--on);stroke-width:3;opacity:0}
.tile.powered .burst{animation:burstOut .7s ease-out}
.tile.powered .bolt{animation:boltFlicker 2.2s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,177,0,.7))}50%{filter:drop-shadow(0 0 9px rgba(255,177,0,.95))}}
@keyframes powerIn{0%{stroke:#ffffff;filter:drop-shadow(0 0 12px rgba(255,255,255,.95))}}
@keyframes flowMove{to{stroke-dashoffset:-24}}
@keyframes bulbIn{0%{transform:scale(.45)}}
@keyframes burstOut{0%{opacity:.95;transform:scale(.4)}100%{opacity:0;transform:scale(2)}}
@keyframes ringPulse{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:-11}}
@keyframes boltFlicker{0%,100%{opacity:1}50%{opacity:.72}}
.lbl{fill:#5a6772;font-size:11px;font-family:var(--mono);text-anchor:middle}
.grid.solved{animation:gridFlash .6s ease-out}
.grid.solved .pipe{animation:none}
.grid.solved .tile{border-color:rgba(61,220,143,.4)}
.grid.solved .pipe{stroke:var(--ok);filter:drop-shadow(0 0 7px rgba(61,220,143,.85))}
.grid.solved .center{fill:var(--ok);stroke:var(--ok)}
.mfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 18px;gap:10px}
.stats{display:flex;gap:14px;font-size:12px;color:var(--dim)}
.mbtns{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;transition:all .15s}

.lvbtns{display:flex;gap:4px}
.lvbtns button{background:transparent;border:1px solid var(--line2);color:var(--dim);border-radius:4px;padding:4px 7px;font-size:10px;cursor:pointer;font-family:var(--mono)}
.lvbtns button.on{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 6px rgba(255,177,0,.25)}
.stamp{position:absolute;inset:0;background:rgba(8,11,13,.87);display:flex;align-items:center;justify-content:center;z-index:5;animation:fade .25s}
.stamp-box{border:3px solid var(--ok);border-radius:12px;padding:20px 32px;text-align:center;transform:rotate(-6deg);color:var(--ok);box-shadow:0 0 30px rgba(61,220,143,.28);animation:stampIn .32s cubic-bezier(.2,1.6,.4,1)}
.tick{font-size:40px;line-height:1}
.stamp-box h3{margin-top:6px;letter-spacing:.22em;font-size:18px}
.stamp-box p{margin-top:8px;font-size:11px;color:var(--ink);opacity:.85}
@keyframes stampIn{from{transform:rotate(-6deg) scale(1.6);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes gridFlash{0%{box-shadow:0 0 0 rgba(61,220,143,0)}35%{box-shadow:0 0 46px rgba(61,220,143,.6)}100%{box-shadow:0 0 0 rgba(61,220,143,0)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#161d24;border:1px solid var(--ok);color:var(--ink);padding:10px 18px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fade .2s}
/* == craft patch: impeccable x industrial-telemetry == */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:99;background-image:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px);background-size:100% 3px}
@media (max-width:640px){.mfoot{flex-wrap:wrap;gap:8px}.mtip{font-size:12px}.stats{font-size:11px;gap:8px}.grid{width:92vw}.card{padding:14px}}
.lvbtns button,.ghost{min-height:34px}
.head h1{font-size:clamp(1.4rem,3.5vw,2rem);letter-spacing:.02em}
</style>
</head>

<main class="wrap">

<script>
'use strict';
/* ---------- 基础工具 ---------- */
var NB=1,NE=2,NS=4,NW=8;
var OPP={1:4,2:8,4:1,8:2};
var DVEC={1:[0,-1],2:[1,0],4:[0,1],8:[-1,0]};
function bits(m){var r=[];for(var d=1;d<=8;d<<=1){if(m&d)r.push(d)}return r}
function rotCW(m){return ((m<<1)&15)|(m>>3)}
function rotN(m,k){for(var i=0;i<k;i++)m=rotCW(m);return m}
function popc(m){var c=0;while(m){m&=m-1;c++}return c}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function $id(s){return document.getElementById(s)}

/* ---------- 参数 ---------- */
var qs=new URLSearchParams(location.search);
var LEVELS={1:{n:4,leaf:[3,4]},2:{n:4,leaf:[5,7]},3:{n:5,leaf:[4,6]},4:{n:5,leaf:[6,8]},5:{n:6,leaf:[7,10]}};
var curLv=parseInt(qs.get('lv')||'',10); if(isNaN(curLv)||curLv<1||curLv>5)curLv=1;
var SIZE=LEVELS[curLv].n;
var seed=parseInt(qs.get('seed')||'',10); if(isNaN(seed)) seed=(Date.now()%1000000)|0;
var DEBUG=qs.get('debug')==='1';

/* ---------- 状态 ---------- */
var pz=null, moves=0, t0=0, timerId=null, solvedFlag=false, verified=false, muted=false, checking=false, lastStars=1, lastSecs=0;
var ST={leafReject:0,solveReject:0};

/* ---------- 谜题生成：随机 Prim 生成树，保证可解且无环 ---------- */
function evaluate(tiles,n){
  var srcI=-1,i;
  for(i=0;i<tiles.length;i++){if(tiles[i].kind==='src'){srcI=i;break}}
  var powered={},dist={}; powered[srcI]=1; dist[srcI]=0; var stack=[srcI];
  while(stack.length){
    var u=stack.shift(),t=tiles[u],x=u%n,y=(u-x)/n,bs=bits(t.mask),b;
    for(b=0;b<bs.length;b++){
      var d=bs[b],nx=x+DVEC[d][0],ny=y+DVEC[d][1];
      if(nx<0||nx>=n||ny<0||ny>=n)continue;
      var v=ny*n+nx;
      if(!powered[v]&&(tiles[v].mask&OPP[d])){powered[v]=1;dist[v]=(dist[u]||0)+1;stack.push(v)}
    }
  }
  var leak=false;
  for(i=0;i<tiles.length&&!leak;i++){
    var t2=tiles[i],x2=i%n,y2=(i-x2)/n,bs2=bits(t2.mask),b2;
    for(b2=0;b2<bs2.length;b2++){
      var d2=bs2[b2],nx2=x2+DVEC[d2][0],ny2=y2+DVEC[d2][1];
      if(nx2<0||nx2>=n||ny2<0||ny2>=n||!(tiles[ny2*n+nx2].mask&OPP[d2])){leak=true;break}
    }
  }
  var allEnd=true;
  for(i=0;i<tiles.length;i++){if(tiles[i].kind==='end'&&!powered[i]){allEnd=false;break}}
  return {powered:powered,dist:dist,leak:leak,allEnd:allEnd,solved:!leak&&allEnd};
}
function genPuzzle(n,sd,leafMin,leafMax){
  for(var att=0;att<150;att++){
    var rng=mulberry32(((sd*2654435761)^((att+1)*40503))>>>0);
    var inT=new Array(n*n),conns=new Array(n*n),i;
    for(i=0;i<n*n;i++){inT[i]=false;conns[i]=0}
    var start=Math.floor(rng()*n*n);
    inT[start]=true;
    var frontier={},sx=start%n,sy=(start-sx)/n,d;
    for(d=1;d<=8;d<<=1){var qx=sx+DVEC[d][0],qy=sy+DVEC[d][1];if(qx>=0&&qx<n&&qy>=0&&qy<n)frontier[qy*n+qx]=1}
    while(true){
      var ks=Object.keys(frontier); if(!ks.length)break;
      var c=+ks[Math.floor(rng()*ks.length)]; delete frontier[c];
      var cx=c%n,cy=(c-cx)/n,nbs=[];
      for(d=1;d<=8;d<<=1){var ax=cx+DVEC[d][0],ay=cy+DVEC[d][1];if(ax>=0&&ax<n&&ay>=0&&ay<n&&inT[ay*n+ax])nbs.push(d)}
      var dd=nbs[Math.floor(rng()*nbs.length)];
      conns[c]|=dd;
      var j=(cy+DVEC[dd][1])*n+(cx+DVEC[dd][0]);
      conns[j]|=OPP[dd]; inT[c]=true;
      for(d=1;d<=8;d<<=1){var bx=cx+DVEC[d][0],by=cy+DVEC[d][1];if(bx>=0&&bx<n&&by>=0&&by<n&&!inT[by*n+bx])frontier[by*n+bx]=1}
    }
    var leaves=[]; for(i=0;i<n*n;i++){if(popc(conns[i])===1)leaves.push(i)}
    if(leaves.length<leafMin||leaves.length>leafMax){ST.leafReject++;continue}
    var src=leaves[Math.floor(rng()*leaves.length)];
    var tiles=[];
    for(i=0;i<n*n;i++){
      var m0=conns[i],kind='pipe',fixed=false,k=0,m=m0;
      if(i===src){kind='src';fixed=true}
      else if(popc(m0)===1){kind='end';fixed=true}
      else{k=Math.floor(rng()*4);m=rotN(m0,k)}
      tiles.push({i:i,mask0:m0,mask:m,k:k,vd:k*90,deg:popc(m0),kind:kind,fixed:fixed});
    }
    var solT=tiles.map(function(t){return {kind:t.kind,mask:t.mask0}});
    if(!evaluate(solT,n).solved){ST.solveReject++;continue}
    if(evaluate(tiles,n).solved){
      for(i=0;i<tiles.length;i++){if(!tiles[i].fixed){tiles[i].k=(tiles[i].k+1)%4;tiles[i].mask=rotCW(tiles[i].mask);tiles[i].vd+=90;break}}
    }
    return {n:n,tiles:tiles,src:src,seedUsed:sd};
  }
  return genPuzzle(n,sd+1);
}

/* ---------- 渲染 ---------- */
function svgFor(t){
  var s='<svg viewBox="0 0 100 100">';
  if(t.kind==='src'){
    s+='<circle class="core" cx="50" cy="50" r="21"/>';
    s+='<path class="bolt" d="M55 33 L41 55 L50 55 L45 69 L61 45 L52 45 Z"/>';
    s+='<text x="50" y="90" class="lbl">PWR</text>';
  }else if(t.kind==='end'){
    s+='<circle class="burst" cx="50" cy="50" r="21"/>';
    s+='<circle class="lamp-ring" cx="50" cy="50" r="25"/>';
    s+='<circle class="bulb" cx="50" cy="50" r="13"/>';
    s+='<text x="50" y="93" class="lbl">OUT</text>';
  }else{
    var bs=bits(t.mask);
    for(var b=0;b<bs.length;b++){
      var dx=DVEC[bs[b]][0],dy=DVEC[bs[b]][1];
      s+='<line class="pipe" x1="50" y1="50" x2="'+(50+dx*48)+'" y2="'+(50+dy*48)+'"/>';
      s+='<line class="flow" x1="50" y1="50" x2="'+(50+dx*48)+'" y2="'+(50+dy*48)+'"/>';
    }
    s+='<circle class="center" cx="50" cy="50" r="'+(t.deg>=3?10:8)+'"/>';
  }
  return s+'</svg>';
}
function buildGrid(){
  var g=$id('grid');
  g.innerHTML='';
  g.style.setProperty('--n',pz.n);
  pz.tiles.forEach(function(t){
    var el=document.createElement('div');
    el.className='tile kind-'+t.kind+(t.fixed?' fixed':' rot');
    el.dataset.i=t.i;
    el.title=t.kind==='src'?'供电核心（固定）':(t.kind==='end'?'目标灯（固定）':'点击顺时针旋转 90°');
    el.innerHTML=svgFor(t);
    if(!t.fixed)el.style.setProperty('--r',t.vd+'deg');
    g.appendChild(el);
    t.el=el;
  });
  refresh();
}
function refresh(){
  var ev=evaluate(pz.tiles,pz.n),i;
  for(i=0;i<pz.tiles.length;i++){
    var el=pz.tiles[i].el,on=!!ev.powered[i];
    if(on&&!el.classList.contains('powered')){
      el.style.setProperty('--d',ev.dist[i]||0);
      el.classList.add('just-on');
      if(el._t)clearTimeout(el._t);
      el._t=setTimeout(function(e){return function(){e.classList.remove('just-on')}}(el),1400);
    }
    el.classList.toggle('powered',on);
  }
  if(ev.solved&&!solvedFlag)onSolved();
}

/* ---------- 音效 ---------- */
var AC=null;
function tone(f,d,type,g,when){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var t=AC.currentTime+(when||0),o=AC.createOscillator(),ga=AC.createGain();
    o.type=type||'square';o.frequency.value=f;
    o.connect(ga);ga.connect(AC.destination);
    ga.gain.setValueAtTime(g||.04,t);
    ga.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
function chime(){tone(523,.14,'triangle',.06,0);tone(659,.14,'triangle',.06,.1);tone(784,.18,'triangle',.06,.2);tone(1046,.3,'triangle',.07,.32)}

/* ---------- 计时与文案 ---------- */
function fmt(s){var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss.toFixed(1)}
function updTime(){if(t0&&!solvedFlag)$id('stTime').textContent=fmt((performance.now()-t0)/1000)}
var QUIPS=['行为特征：手速不均匀 ✔ 有犹豫 ✔','行为特征：旋转轨迹抖动 ✔ 人类概率 99.7%','行为特征：未检测到毫秒级精准点击 ✔'];

/* ---------- 挑战流程 ---------- */
function newChallenge(){
  solvedFlag=false;moves=0;
  $id('grid').classList.remove('solved');
  $id('stamp').hidden=true;
  $id('mStatus').textContent='接入中…';$id('mStatus').classList.remove('pass');
  seed=((seed*1103515245+12345)%1000000007)|0; if(seed<0)seed=-seed;
  var L=LEVELS[curLv];
  var custom=null;
  try{
    var arr=JSON.parse(localStorage.getItem('endland-levels-circuit')||'[]');
    var en=arr.filter(function(x){return x && x.enabled!==false && x.params});
    if(en.length && Math.random()<0.3) custom=en[Math.floor(Math.random()*en.length)];
  }catch(e){}
  if(custom){ curLv=Math.min(5,Math.max(1,custom.lv||curLv)); L=LEVELS[curLv]; }
  var pn=custom? (custom.params.n||L.n) : L.n;
  var plm=custom? (custom.params.leafMin||L.leaf[0]) : L.leaf[0];
  var plx=custom? (custom.params.leafMax||L.leaf[1]) : L.leaf[1];
  pz=genPuzzle(pn,seed,plm,plx);
  pz.best=0; pz.lv=curLv;
  pz.tiles.forEach(function(t){ if(!t.fixed) pz.best+=(4-t.k)%4; });
  if(qs.get('export')==='1'){
    console.log('[LEVEL] '+JSON.stringify({game:'circuit',id:'circuit-'+curLv+'-'+pz.seedUsed,lv:curLv,name:(custom?custom.name:('随机 '+pz.n+'×'+pz.n)),desc:custom?(custom.desc||'自定义关卡'):'源石电路难度 V'+curLv,play:'点击旋转管件，接通供电核心与全部目标灯',params:{n:pz.n,leafMin:plm,leafMax:plx,seed:pz.seedUsed},enabled:true}));
  }
  buildGrid();
  moves=0;$id('stMoves').textContent='旋转 0';
  t0=performance.now();
  clearInterval(timerId);timerId=setInterval(updTime,100);updTime();
  if(DEBUG){
    var need={};
    pz.tiles.forEach(function(t){if(!t.fixed){var c=(4-t.k)%4;if(c)need[t.i]=c}});
    console.log('[PZ] '+JSON.stringify({seed:pz.seedUsed,n:pz.n,lv:curLv,best:pz.best,need:need,checked:'可解性检测通过'}));
  }
}
function onSolved(){
  solvedFlag=true;
  clearInterval(timerId);
  var secs=(performance.now()-t0)/1000;
  $id('grid').classList.add('solved');
  var st=$id('mStatus');st.textContent='校验通过';st.classList.add('pass');
  var stars = moves<=pz.best ? 3 : (moves<=Math.ceil(pz.best*1.5) ? 2 : 1);
  lastStars=stars;lastSecs=secs;
  var starTxt='★★★'.slice(0,stars)+'☆☆☆'.slice(0,3-stars);
  $id('stampStats').textContent='难度 V'+curLv+' · '+starTxt+' · 旋转 '+moves+'/'+pz.best+' · 用时 '+secs.toFixed(1)+'s · '+QUIPS[Math.floor(Math.random()*QUIPS.length)];
  $id('stamp').hidden=false;
  chime();
  setTimeout(closeAndVerify,1800);
}
function closeAndVerify(){
  verified=true;
  $id('mask').hidden=true;
  var box=$id('captchaBox');
  box.classList.add('ok');
  $id('cbIcon').textContent='✔';$id('cbIcon').classList.remove('spin');
  $id('cbText').textContent='验证成功';
  $id('loginBtn').disabled=false;
  $id('formNote').textContent='身份已确认，欢迎回来，操作员。';
  toast('验证通过 · HUMAN VERIFIED');
  try{ if(window.parent && window.parent!==window) window.parent.postMessage({type:'pz-solved', device:'V-40053', game:'circuit', lv:curLv, stars:lastStars, moves:moves, secs:Math.round(lastSecs*10)/10}, '*'); }catch(e){}
}
function toast(msg){
  var t=$id('toast');t.textContent=msg;t.hidden=false;
  clearTimeout(t._h);t._h=setTimeout(function(){t.hidden=true},2600);
}

/* ---------- 事件 ---------- */
$id('captchaBox').addEventListener('click',function(){
  if(checking)return;
  if(verified){
    verified=false;
    this.classList.remove('ok');
    $id('cbIcon').textContent='';
    $id('cbText').textContent='我不是机器人（再来一局）';
    $id('loginBtn').disabled=true;
    $id('formNote').textContent='重新完成人机验证后才能登录。';
  }
  checking=true;
  var ic=$id('cbIcon');ic.classList.add('spin');
  $id('cbText').textContent='正在校验访问签名…';
  tone(320,.1,'triangle',.05);
  setTimeout(function(){
    checking=false;
    newChallenge();
    $id('mask').hidden=false;
    tone(440,.08,'triangle',.05);
  },750+Math.random()*350);
});
$id('grid').addEventListener('click',function(e){
  var el=e.target.closest('.tile');if(!el||solvedFlag)return;
  var t=pz.tiles[+el.dataset.i];
  if(t.fixed){
    el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');
    tone(110,.12,'sawtooth',.05);return;
  }
  t.k=(t.k+1)%4;t.mask=rotCW(t.mask);t.vd+=90;moves++;
  el.style.setProperty('--r',t.vd+'deg');
  $id('stMoves').textContent='旋转 '+moves;
  tone(170+Math.random()*50,.07,'square',.045);
  refresh();
});
$id('btnNew').addEventListener('click',function(){tone(300,.08,'triangle',.05);newChallenge()});
(function(){
  var box=$id('lvbtns'),LVN=['','简单','容易','中等','较难','困难'];
  for(var i=1;i<=5;i++){
    (function(i){
      var b=document.createElement('button');
      b.type='button';b.textContent='V'+i;
      if(i===curLv)b.classList.add('on');
      b.title='难度 V'+i+'（'+LVN[i]+'）· '+LEVELS[i].n+'×'+LEVELS[i].n;
      b.addEventListener('click',function(){
        if(curLv===i)return;
        curLv=i;tone(300+i*40,.08,'triangle',.05);
        Array.prototype.forEach.call(box.children,function(c,k){c.classList.toggle('on',k===i-1)});
        newChallenge();
      });
      box.appendChild(b);
    })(i);
  }
})();
$id('btnMute').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇':'🔊'});
$id('loginForm').addEventListener('submit',function(e){e.preventDefault();if(verified)toast('演示环境：登录请求已放行（无后端）')});

/* ---------- 自检：连续生成 300 局验证永不出无解关卡 ---------- */
if(qs.get('selftest')==='1'){
  var okN=0, per=[];
  for(var lv=1;lv<=5;lv++){
    var L=LEVELS[lv], ok2=0;
    for(var st=0;st<60;st++){genPuzzle(L.n,lv*1000+st,L.leaf[0],L.leaf[1]);ok2++;okN++}
    per.push('V'+lv+':'+ok2);
  }
  console.log('[SELFTEST] 五档各 60 局（'+per.join(' ')+'）全部通过可解性检测；叶子数重试 '+ST.leafReject+' 次；可解性检测失败 '+ST.solveReject+' 次（应为 0）');
}

/* ---------- 合集页直通模式 ---------- */
if(qs.get('direct')==='1'){setTimeout(function(){ $id('captchaBox').click(); }, 150);}

/* 静音持久化：九关共享同一个键 endland-mute（跨关、跨刷新记住用户选择；默认仍为有声） */
(function(){
  try{
    if(localStorage.getItem('endland-mute')==='on')muted=true;
    var b=document.getElementById('btnMute');
    if(!b)return;
    if(muted)b.textContent='🔇';
    b.addEventListener('click',function(){try{localStorage.setItem('endland-mute',muted?'on':'off')}catch(e){}});
window.addEventListener('storage',function(e){if(e.key==='endland-mute'){muted=(e.newValue==='on');var mb2=document.getElementById('btnMute');if(mb2)mb2.textContent=muted?'🔇':'🔊';}});
  }catch(e){}
})();
</script>
