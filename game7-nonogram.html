<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%220.9em%22 font-size=%2290%22>◈</text></svg>'>
<meta name="theme-color" content="#0b0e11">
<title>访客协议 VISITOR PROTOCOL · 图形校验</title>
<style>
html{-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
button,a,[role=button]{touch-action:manipulation}
button:active,a:active,[role=button]:active{filter:brightness(.9)}
@media(hover:hover) and (pointer:fine){
.captcha-box:hover{border-color:var(--line2)}
.cell:hover{border-color:rgba(255,177,0,.5);background:#20272f}
.diffbtn:hover{border-color:var(--acc);color:var(--acc)}
.ghost:hover{border-color:var(--acc);color:var(--acc)}
}

:root{--bg:#0b0e11;--line:#28313b;--line2:#3a4550;--ink:#d9e0e7;--dim:#8a96a2;--acc:#ffb100;--on:#ffcb4a;--ok:#3ddc8f;--bad:#ff5252;--cy:#39d0e0;--mono:ui-monospace,Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1000px 520px at 75% -10%,rgba(255,177,0,.07),transparent 60%),var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,'Microsoft YaHei',sans-serif;overflow-x:hidden;padding:24px 12px}
.bg{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:42px 42px;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at center,black 25%,transparent 78%);mask-image:radial-gradient(ellipse at center,black 25%,transparent 78%)}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.frame{position:relative}
.frame::after{content:"";position:absolute;inset:6px;border:1px dashed rgba(255,177,0,.16);border-radius:10px;pointer-events:none}
.card{width:min(92vw,400px);background:linear-gradient(180deg,#161c23,#12171d);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
.hazard{height:8px;background:repeating-linear-gradient(45deg,var(--acc) 0 12px,#141414 12px 24px);opacity:.85}
.brand{display:flex;gap:12px;align-items:center;padding:18px 22px 6px}
.logo{width:40px;height:40px;border:1px solid var(--acc);border-radius:8px;display:grid;place-items:center;color:var(--acc);font-size:20px;box-shadow:inset 0 0 12px rgba(255,177,0,.25)}
.brand h1{font-size:17px;letter-spacing:.14em}
.brand p{font-size:10.5px;margin-top:3px;letter-spacing:.08em}
form{padding:10px 22px 22px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:.1em}
.field input{width:100%;background:#0e1318;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font-size:14px;outline:none}
.captcha-box{margin:16px 0 12px;display:flex;align-items:center;gap:12px;background:#0e1318;border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;user-select:none;transition:border-color .15s}

.captcha-box.ok{border-color:rgba(61,220,143,.55);cursor:default}
.cb{flex:0 0 auto;width:22px;height:22px;border:2px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-size:14px;color:transparent}
.captcha-box.ok .cb{border-color:var(--ok);color:var(--ok)}
.cb.spin{border-radius:50%;border-color:var(--acc) transparent var(--acc) transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loginBtn{width:100%;padding:12px;border:0;border-radius:8px;background:linear-gradient(180deg,#ffc23d,#f5a300);color:#1a1200;font-weight:700;letter-spacing:.3em;font-size:14px;cursor:not-allowed;opacity:.4;transition:all .2s}
#loginBtn:not(:disabled){cursor:pointer;opacity:1;box-shadow:0 6px 18px rgba(255,177,0,.22)}
.note{font-size:12px;margin-top:10px}
.credit{margin-top:14px;font-size:11px;color:var(--dim);opacity:.75;text-align:center;max-width:460px;line-height:1.7}
.mask{position:fixed;inset:0;background:rgba(5,7,9,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;animation:fade .2s}
.modal{width:min(94vw,540px);background:linear-gradient(180deg,#161c23,#10151b);border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 20px 2px;gap:10px}
.mhead h2{font-size:16px;letter-spacing:.1em}
.mhead h2 span{font-size:11px;letter-spacing:.06em}
.sub{font-size:11px;margin-top:4px}
.status{flex:0 0 auto;font-size:11px;color:var(--acc);border:1px solid rgba(255,177,0,.4);padding:4px 8px;border-radius:4px}
.status.pass{color:var(--ok);border-color:rgba(61,220,143,.5)}
.mtip{padding:8px 20px 0;font-size:12.5px;color:var(--dim);line-height:1.7}
.mtip b{color:var(--ink)}
.nono{padding:12px 20px 4px;display:flex;justify-content:center;overflow-x:auto}
.nonogrid{display:grid;gap:2px;justify-content:center}
.nh{display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:700;color:#8a96a2;background:#0d1217;border:1px solid var(--line);border-radius:3px;min-width:0;min-height:16px;padding:0 2px;transition:color .18s,border-color .18s,background .18s;overflow:hidden}
.nh.blank{background:transparent;border:0}
.nh.done{opacity:.34}
.nh.hit{color:var(--ok);border-color:rgba(61,220,143,.6);background:rgba(61,220,143,.08)}
.nh.over{color:var(--bad);border-color:rgba(255,82,82,.65);background:rgba(255,82,82,.1)}
.nh.err{color:var(--bad);border-color:rgba(255,82,82,.65);background:rgba(255,82,82,.1)}
.cell{position:relative;background:#1a2129;border:1px solid #262f38;border-radius:2px;cursor:pointer;touch-action:manipulation;transition:background .12s,border-color .12s;overflow:hidden}

.cell.mk{background:#0d1217;border-color:#2b343d}
.cell.fill{background:linear-gradient(180deg,#ffc23d,#e79b00);border-color:#ffd97a;box-shadow:inset 0 0 10px rgba(255,177,0,.45)}
.cell.bad{background:rgba(255,82,82,.22);border-color:rgba(255,82,82,.75);animation:shake .3s}
.cell.lock{cursor:default;pointer-events:none}
.cell.wrong{background:linear-gradient(180deg,#ffc23d,#e79b00);border-color:#ff8f5e;box-shadow:inset 0 0 10px rgba(255,82,82,.6)}
.cell svg{position:absolute;inset:22%;width:56%;height:56%;stroke:#4c5866;stroke-width:13;stroke-linecap:round}
.nonogrid.solved .cell.fill,.nonogrid.solved .cell.wrong{background:linear-gradient(180deg,#9df3c6,#3ddc8f);border-color:#9df3c6;box-shadow:inset 0 0 10px rgba(61,220,143,.5)}
.nonogrid.solved{animation:gridFlash .65s ease-out}
@keyframes gridFlash{0%{box-shadow:0 0 0 rgba(61,220,143,0)}35%{box-shadow:0 0 46px rgba(61,220,143,.6)}100%{box-shadow:0 0 0 rgba(61,220,143,0)}}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.rtip{padding:10px 20px 0;font-size:11px;color:var(--dim);line-height:1.7}
.diffbar{display:flex;gap:6px;padding:10px 20px 0;align-items:center}
.diffbar .dlabel{font-size:11px;color:var(--dim);letter-spacing:.08em;margin-right:2px}
.diffbtn{flex:1 1 0;min-width:0;background:transparent;border:1px solid var(--line2);color:var(--dim);border-radius:6px;padding:5px 0;font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .15s;min-height:34px}

.diffbtn.on{border-color:var(--acc);color:#1a1200;background:linear-gradient(180deg,#ffc23d,#f5a300);font-weight:700}
.stars{color:var(--acc);letter-spacing:.16em;font-size:13px}
.mfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 18px;gap:10px;flex-wrap:wrap}
.stats{display:flex;gap:12px;font-size:12px;color:var(--dim)}
#stErr.bad{color:var(--bad)}
#stProg.eq{color:var(--ok)}
.mbtns{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;transition:all .15s}

.ghost.on{border-color:var(--cy);color:#04191d;background:linear-gradient(180deg,#6fe4f0,#39d0e0);font-weight:700}
.mode{display:flex;gap:6px;padding:12px 20px 0}
.stamp{position:absolute;inset:0;background:rgba(8,11,13,.87);display:flex;align-items:center;justify-content:center;z-index:5;animation:fade .25s}
.stamp-box{border:3px solid var(--ok);border-radius:12px;padding:20px 32px;text-align:center;transform:rotate(-6deg);color:var(--ok);box-shadow:0 0 30px rgba(61,220,143,.28);animation:stampIn .32s cubic-bezier(.2,1.6,.4,1);max-width:88%}
.tick{font-size:40px;line-height:1}
.stamp-box h3{margin-top:6px;letter-spacing:.22em;font-size:18px}
.stamp-box p{margin-top:8px;font-size:11px;color:var(--ink);opacity:.85;line-height:1.6}
@keyframes stampIn{from{transform:rotate(-6deg) scale(1.6);opacity:0}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#161d24;border:1px solid var(--ok);color:var(--ink);padding:10px 18px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fade .2s;max-width:min(92vw,440px)}
.toast.bad{border-color:var(--bad)}
/* == craft patch: impeccable x industrial-telemetry == */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:99;background-image:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px);background-size:100% 3px}
@media (max-width:640px){.mfoot{flex-wrap:wrap;gap:8px}.mtip{font-size:12px}.stats{font-size:11px;gap:8px}.card{padding:14px}.nono{padding:12px 10px 4px}}
.lvbtns button,.ghost{min-height:34px}
@media (max-height:560px){.nono{overflow-y:auto;max-height:52vh}}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="bg"></div>
<main class="wrap">
  <section class="card frame">
    <div class="hazard"></div>
    <header class="brand">
      <div class="logo">▦</div>

    <form id="loginForm">
      <label class="field"><span>操作员编号</span><input value="klee_0413" readonly tabindex="-1"></label>

<script>
'use strict';
/* ---------- 基础工具 ---------- */
function $id(s){return document.getElementById(s)}
var HAS_DOC=(typeof document!=='undefined'&&!!document.getElementById);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 参数 ---------- */
var qs=new URLSearchParams(location.search);
var LV_TABLE={
  1:{w:5,h:5,d:[45,55],name:'教学',hw:24},
  2:{w:5,h:7,d:[45,55],name:'入门',hw:46},
  3:{w:7,h:7,d:[45,55],name:'常规',hw:72},
  4:{w:8,h:8,d:[45,55],name:'进阶',hw:88},
  5:{w:10,h:10,d:[60,60],name:'极限',hw:100}
};
var GAME_KEY='nonogram', DEVICE='V-40059';
var TIP_TABLE={
  1:'残影重建 · 教学档：5×5 网格，边缘校验码为**单段**，涂黑格约占一半——从数字最大的那一行先下手。',
  2:'残影重建 · 入门档：5 宽 7 高，出现**单格段**（数字 1）——先把它两侧各划掉一格当边界。',
  3:'残影重建 · 常规档：7×7，出现**多段提示**（如 1 3 2）——段与段之间至少空一格。',
  4:'残影重建 · 进阶档：8×8，段更长、留白更碎——每涂完一段就回头核验这一行的段数。',
  5:'残影重建 · 极限档：10×10、涂黑率 60%+，多段密集，需要行列交叉推演。'
};
var CUSTOM_KEY='endland-levels-'+GAME_KEY;
var seed=parseInt(qs.get('seed')||'',10); if(isNaN(seed)) seed=((Date.now()%1000000)|0)+1;
var DEBUG=qs.get('debug')==='1';
function clampLv(v){v=parseInt(v,10);if(isNaN(v))return 1;return Math.max(1,Math.min(5,v))}
var lvRaw=qs.get('lv');
var LV=clampLv(lvRaw===null||lvRaw===''?1:lvRaw);
var SPEC=LV_TABLE[LV];
function specFor(v){return LV_TABLE[clampLv(v)]}

/* ---------- 状态 ---------- */
var pz=null, cells=null, marks=null, moves=0, errors=0, t0=0, timerId=null, solvedFlag=false, verified=false, muted=false, checking=false, markMode=false, failedSent=false;
var ST={genAttempts:0,uniqReject:0,densRetry:0,solveReject:0};
var customLevels=[],queuedLevel=null,gridLocked=false;
var lastFailKey=-1;

/* ---------- 关卡缓存（endland-levels-nonogram） ---------- */
function readCustomLevels(){
  var arr=[],raw=null;
  try{raw=localStorage.getItem(CUSTOM_KEY)}catch(e){raw=null}
  if(!raw)return arr;
  try{
    var parsed=JSON.parse(raw);
    if(Object.prototype.toString.call(parsed)==='[object Array]'){
      for(var i=0;i<parsed.length;i++){
        var it=parsed[i];
        if(!it||typeof it!=='object')continue;
        if(it.enabled===false)continue;
        if(it.game&&it.game!==GAME_KEY)continue;
        if(it.lv===undefined||it.lv===null)continue;
        arr.push(it);
      }
    }
  }catch(e){}
  return arr;
}
function pickQueuedLevel(lv){
  for(var i=0;i<customLevels.length;i++){
    var it=customLevels[i];
    if(clampLv(it.lv)!==lv)continue;
    if(!it.params||!it.params.width||!it.params.height)continue;
    if(!it.params.rowHint||!it.params.colHint)continue;
    if(!it.params.solution)continue;
    return it;
  }
  return null;
}
function writeSampleLevels(samples){
  try{
    var cur=readCustomLevels();
    var seen={},i;
    for(i=0;i<cur.length;i++)seen[String(cur[i].id)]=1;
    var merged=cur.slice();
    for(i=0;i<samples.length;i++){if(!seen[String(samples[i].id)])merged.push(samples[i])}
    localStorage.setItem(CUSTOM_KEY,JSON.stringify(merged));
  }catch(e){}
}

/* ---------- 提示计算 / 求解器 ---------- */
function runsOf(line){
  var r=[],run=0,i;
  for(i=0;i<line.length;i++){if(line[i])run++;else{if(run)r.push(run);run=0}}
  if(run)r.push(run);
  return r;
}
function hintOf(line){var r=runsOf(line);return r.length?r:[0]}
function hintsOf(m){var r=[],c=[],y,x;for(y=0;y<m.length;y++)r.push(hintOf(m[y]));for(x=0;x<m[0].length;x++){var col=[];for(y=0;y<m.length;y++)col.push(m[y][x]);c.push(hintOf(col))}return {rowHint:r,colHint:c}}
function hintText(h){return h.join(' ')||'0'}
function hintLen(h){var s=0,i;for(i=0;i<h.length;i++)s+=h[i];return s+(h.length-1)}
function emptyLine(h){return h.length===1&&h[0]===0}

/* 行（或列）约束下的所有合法线段排布 */
/* 行（或列）约束下的所有合法排布；line 为三态（-1 未知 / 0 白 / 1 黑），输出完整 0/1 排布 */
function linePatterns(line,hint){
  var n=line.length,out=[],h=hint.slice(),t;
  if(h.length===1&&h[0]===0){
    for(t=0;t<n;t++)if(line[t]===1)return out;
    out.push(new Array(n).fill(0));
    return out;
  }
  function rec(pos,hi,acc){
    if(hi===h.length){
      for(var t=pos;t<n;t++)if(line[t]===1)return;
      var tail=[];
      for(t=pos;t<n;t++)tail.push(0);
      out.push(acc.concat(tail));
      return;
    }
    var rem=0,k;
    for(k=hi;k<h.length;k++)rem+=h[k];
    rem+=h.length-1-hi;
    var maxStart=n-rem;
    for(var s=pos;s<=maxStart;s++){
      var bad=false;
      for(t=pos;t<s;t++)if(line[t]===1){bad=true;break}
      if(bad)break;
      var ok=true;
      for(t=s;t<s+h[hi];t++)if(line[t]===0){ok=false;break}
      if(ok&&s+h[hi]<n&&line[s+h[hi]]===1)ok=false;
      if(!ok)continue;
      var chunk=[];
      for(t=pos;t<s;t++)chunk.push(0);
      for(t=0;t<h[hi];t++)chunk.push(1);
      if(s+h[hi]<n)chunk.push(0);
      rec(s+h[hi]+1,hi+1,acc.concat(chunk));
    }
  }
  rec(0,0,[]);
  return out;
}
/* 一条线（三态）的所有排布 → 三态合并；pats 为空表示该线已矛盾 */
function mergePattern(hint,len,line){
  var pats=linePatterns(line||new Array(len).fill(-1),hint);
  var res=new Array(len).fill(-1),i,j;
  for(i=0;i<len;i++){
    var one=true,zero=true;
    for(j=0;j<pats.length;j++){if(pats[j][i]!==1)one=false;if(pats[j][i]!==0)zero=false}
    res[i]=one?1:(zero?0:-1);
  }
  return {pats:pats,merged:res};
}
/* 行/列约束传播 + 分支计数；返回 {ok,count,unique}，计数到 cap 即剪枝 */
function countSolutions(rowHint,colHint,w,h,cap){
  cap=cap||2;
  if(!rowHint||!colHint||rowHint.length!==h||colHint.length!==w)return {count:0,ok:false,unique:false,reason:'提示与尺寸不匹配'};
  var grid=[],y,x,r;
  for(y=0;y<h;y++){var rw=[];for(x=0;x<w;x++)rw.push(-1);grid.push(rw)}
  function propagate(){
    var changed=true,rounds=0,mp,col,row;
    while(changed){
      if(rounds++>h+w+6)return false;
      changed=false;
      for(y=0;y<h;y++){
        row=grid[y];
        mp=mergePattern(rowHint[y],w,row);
        if(!mp.pats.length)return false;
        for(x=0;x<w;x++){
          if(row[x]!==-1)continue;
          if(mp.merged[x]===1){row[x]=1;changed=true}else if(mp.merged[x]===0){row[x]=0;changed=true}
        }
      }
      for(x=0;x<w;x++){
        col=[];
        for(r=0;r<h;r++)col.push(grid[r][x]);
        mp=mergePattern(colHint[x],h,col);
        if(!mp.pats.length)return false;
        for(y=0;y<h;y++){
          if(col[y]!==-1)continue;
          if(mp.merged[y]===1){grid[y][x]=1;changed=true}else if(mp.merged[y]===0){grid[y][x]=0;changed=true}
        }
      }
    }
    return true;
  }
  var count=0,nodes=0,aborted=false;
  function dfs(){
    if(count>=cap)return;
    if(++nodes>200000){aborted=true;return}
    if(!propagate())return;
    var best=1e9,by=-1,bx=-1,rowPick=true,xx,yy,u,u2;
    for(yy=0;yy<h;yy++){u=0;for(xx=0;xx<w;xx++)if(grid[yy][xx]===-1)u++;if(u>0&&u<best){best=u;by=yy;bx=-1;rowPick=true}}
    for(xx=0;xx<w;xx++){u2=0;for(yy=0;yy<h;yy++)if(grid[yy][xx]===-1)u2++;if(u2>0&&u2<best){best=u2;by=-1;bx=xx;rowPick=false}}
    if(best===1e9){count++;return}
    if(rowPick){for(xx=0;xx<w;xx++)if(grid[by][xx]===-1){bx=xx;break}}
    else{for(yy=0;yy<h;yy++)if(grid[yy][bx]===-1){by=yy;break}}
    var save=[];
    for(yy=0;yy<h;yy++)save.push(grid[yy].slice());
    for(var v=1;v>=0;v--){
      grid[by][bx]=v;
      dfs();
      for(yy=0;yy<h;yy++)for(xx=0;xx<w;xx++)grid[yy][xx]=save[yy][xx];
      if(count>=cap||aborted)return;
    }
  }
  dfs();
  if(aborted)return {count:cap,ok:true,unique:false,aborted:true};
  return {count:count,ok:count>0,unique:count===1};
}
function gridFrom(p){
  var m=[],y,x;
  for(y=0;y<p.height;y++){var row=[];for(x=0;x<p.width;x++)row.push(p.answer[y*p.width+x]?1:0);m.push(row)}
  return m;
}
function hintsMatch(m,rowHint,colHint){
  var h=hintsOf(m),i;
  if(h.rowHint.length!==rowHint.length||h.colHint.length!==colHint.length)return false;
  for(i=0;i<rowHint.length;i++)if(h.rowHint[i].join(',')!==rowHint[i].join(','))return false;
  for(i=0;i<colHint.length;i++)if(h.colHint[i].join(',')!==colHint[i].join(','))return false;
  return true;
}
function verifyPuzzle(p){
  var m=gridFrom(p),h,v,i,ones=0;
  for(i=0;i<p.answer.length;i++)if(p.answer[i])ones++;
  if(!ones)return {ok:false,reason:'答案为空'};
  if(ones===p.width*p.height)return {ok:false,reason:'答案全满'};
  h=hintsOf(m);
  if(!hintsMatch(m,p.rowHint,p.colHint))return {ok:false,reason:'提示与答案不一致'};
  for(i=0;i<p.width;i++){var col=[];for(var y=0;y<p.height;y++)col.push(m[y][i]);if(hintLen(p.colHint[i])>p.height)return {ok:false,reason:'列段长越界'}}
  for(i=0;i<p.height;i++)if(hintLen(p.rowHint[i])>p.width)return {ok:false,reason:'行段长越界'};
  v=countSolutions(p.rowHint,p.colHint,p.width,p.height,2);
  if(!v.unique)return {ok:false,reason:'解不唯一（count='+v.count+'）'};
  return {ok:true,ones:ones,unique:true,count:v.count};
}

/* ---------- 生成：种子 RNG → 0/1 矩阵 → 提示 → 唯一性判定 ---------- */
function randOnes(cnt,dens,tot){
  var idx=[],i;
  for(i=0;i<tot;i++)idx.push(i);
  for(i=tot-1;i>0;i--){var j=Math.floor(cnt.rng()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}
  var on=[],k;
  for(k=0;k<i0(cnt,tot);k++)on.push(idx[k]);
  return on;
}
function i0(o,tot){return o.onCount}
function buildPuzzle(rng,w,h,pct){
  var tot=w*h,onCount=Math.max(1,Math.min(tot-1,Math.round(tot*pct/100)));
  var idx=[],i;
  for(i=0;i<tot;i++)idx.push(i);
  for(i=tot-1;i>0;i--){var j=Math.floor(rng()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}
  var answer=new Array(tot).fill(0);
  for(i=0;i<onCount;i++)answer[idx[i]]=1;
  var m=[],y,x;
  for(y=0;y<h;y++){var row=[];for(x=0;x<w;x++)row.push(answer[y*w+x]);m.push(row)}
  var hints=hintsOf(m);
  return {width:w,height:h,answer:answer,rowHint:hints.rowHint,colHint:hints.colHint,
          ones:onCount,dens:+(onCount/tot*100).toFixed(1),runs:runsOf(answer).length};
}
function genPuzzle(sd,spec,rep){
  spec=spec||specFor(LV);
  rep=rep||{attempts:0,uniqReject:0,densRetry:0,solveReject:0};
  var dens=(spec.d[0]+spec.d[1])/2, tuning=false, out=null, i;
  for(i=0;i<50;i++){
    if(tuning)dens+=2;
    if(dens>78)dens=spec.d[1];
    var rng=mulberry32(((sd*2654435761)^((i+1)*40503))>>>0);
    var p=buildPuzzle(rng,spec.w,spec.h,dens);
    rep.attempts++;
    var v=countSolutions(p.rowHint,p.colHint,p.width,p.height,2);
    if(v.ok&&v.unique){out=p;break}
    if(!v.ok){rep.solveReject++;continue}
    rep.uniqReject++;
    if(rep.uniqReject%10===0){tuning=true;rep.densRetry++}
  }
  if(!out)out=uniqueCandidates(sd,spec,rep);
  if(!out)out=barPuzzle(sd,spec,rep);
  out.spec=spec;
  out.regen=rep;
  out.seedUsed=sd;
  out.custom=(queuedLevel&&queuedLevel.id)?queuedLevel.id:null;
  out.lv=LV;
  return out;
}
/* 主循环未收敛时的继续搜索：仍然逐个候选过求解器，绝不返回未经证实的题面 */
function uniqueCandidates(sd,spec,rep){
  var i,p,v,dens,rng,span=79-spec.d[0];
  for(i=0;i<400;i++){
    dens=spec.d[0]+((i*7)%span);
    rng=mulberry32(((sd*40503)^((i+997)*2246822519)^((spec.w<<16)|spec.h))>>>0);
    p=buildPuzzle(rng,spec.w,spec.h,dens);
    rep.attempts++;
    v=countSolutions(p.rowHint,p.colHint,p.width,p.height,2);
    if(v.ok&&v.unique)return p;
    if(v.ok)rep.uniqReject++;else rep.solveReject++;
  }
  return null;
}
/* 兜底构造：k 行整行涂黑、其余全空。该构型的行提示只可能是 [w]（该行必然全黑）或 [0]（该行必然全空），
   行提示自身已唯一确定整张图，故解必唯一；返回前仍由求解器复核 */
function barPuzzle(sd,spec,rep){
  var w=spec.w,h=spec.h,tot=w*h,k=Math.max(1,Math.min(h-1,Math.round(h*(spec.d[0]+spec.d[1])/2/100)));
  var rng=mulberry32(((sd*2654435761)^1234567)>>>0),rows=[],i,y,x;
  for(i=0;i<h;i++)rows.push(i);
  for(i=h-1;i>0;i--){var j=Math.floor(rng()*(i+1)),t=rows[i];rows[i]=rows[j];rows[j]=t}
  var answer=new Array(tot).fill(0);
  for(i=0;i<k;i++)for(x=0;x<w;x++)answer[rows[i]*w+x]=1;
  var m=[];
  for(y=0;y<h;y++){var r=[];for(x=0;x<w;x++)r.push(answer[y*w+x]);m.push(r)}
  var hh=hintsOf(m);
  rep.attempts++;rep.densRetry++;
  return {width:w,height:h,answer:answer,rowHint:hh.rowHint,colHint:hh.colHint,
          ones:k*w,dens:+(k*w/tot*100).toFixed(1),runs:runsOf(answer).length};
}
function puzzleFromCustom(item){
  var p=item.params;
  var width=Math.max(2,Math.min(12,parseInt(p.width,10)||5));
  var height=Math.max(2,Math.min(12,parseInt(p.height,10)||5));
  var sol=p.solution||[],answer=[],i;
  for(i=0;i<width*height;i++)answer.push(sol[i]?1:0);
  var q={width:width,height:height,answer:answer,rowHint:p.rowHint,colHint:p.colHint,
         ones:p.ones||0,dens:+( (p.ones||0)/(width*height)*100 ).toFixed(1),runs:0,
         seedUsed:p.seed||seed,custom:item.id||null,lv:clampLv(item.lv),fromCustom:true};
  q.spec={w:width,h:height,d:[0,0],name:'自定义',hw:0};
  q.regen={attempts:0,uniqReject:0,densRetry:0,solveReject:0};
  var v=verifyPuzzle(q);
  q.customValid=!!v.ok;
  if(!v.ok)q.customReason=v.reason;
  return q;
}

function cellIdx(x,y){return y*pz.width+x}

function buildGrid(){

  for(y=0;y<h;y++)if(pz.rowHint[y].length>maxLen)maxLen=pz.rowHint[y].length;
  var avail=Math.min(window.innerWidth*0.86,384);

  g.style.gridTemplateColumns='repeat('+maxLen+',minmax('+Math.round(cell*0.5)+'px,1fr)) repeat('+w+',minmax(0,'+cell+'px))';
  g.style.gridAutoRows=cell+'px';
  function at(cls,row,col){var e=document.createElement('div');e.className=cls;e.style.gridRow=row;e.style.gridColumn=col;return e}

      el=at('nh',y+1,maxLen+x+1);
      el.id='hc-'+x+'a'+y;

      else{el.classList.add('blank')}

  for(y=0;y<h;y++){

    for(x=0;x<maxLen;x++){
      var s2=x-(maxLen-rh.length);
      el=at('nh',hintRows+y+1,x+1);
      el.id='hr-'+y+'a'+x;
      if(s2>=0&&s2<rh.length)el.textContent=rh[s2];
      else el.classList.add('blank');
      if(emptyLine(rh))el.classList.add('done');
      el.title='第 '+(y+1)+' 行校验码：'+hintText(rh);

}
function paintCell(x,y){

function lineDone(hint,line){

function rowLine(y){var a=[],x;for(x=0;x<pz.width;x++)a.push(cells[cellIdx(x,y)]);return a}
function colLine(x){var a=[],y;for(y=0;y<pz.height;y++)a.push(cells[cellIdx(x,y)]);return a}
function refreshHints(){
  var x,y,hintRows=1,maxLen=1,i;
  for(x=0;x<pz.width;x++)if(pz.colHint[x].length>hintRows)hintRows=pz.colHint[x].length;
  for(y=0;y<pz.height;y++)if(pz.rowHint[y].length>maxLen)maxLen=pz.rowHint[y].length;
  for(x=0;x<pz.width;x++){
    var hc=pz.colHint[x],done=lineDone(hc,colLine(x))&&!emptyLine(hc),over=false,hit=false;
    if(!emptyLine(hc)){var cn=0;for(y=0;y<pz.height;y++)if(cells[cellIdx(x,y)]===1)cn++;over=cn>hintLen(hc)}

  for(y=0;y<pz.height;y++){

    if(!emptyLine(rh)){var rn=0;for(x=0;x<pz.width;x++)if(cells[cellIdx(x,y)]===1)rn++;ro=rn>hintLen(rh)}
    for(i=0;i<maxLen;i++){
      var er=$id('hr-'+y+'a'+i);if(!er)continue;
      er.className='nh'+(i-(maxLen-rh.length)<0?' blank':'')+(rd?' done':'')+(ro?' over':'');

/* ---------- 音效 ---------- */
var AC=null;
function tone(f,d,type,g,when){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var t=AC.currentTime+(when||0),o=AC.createOscillator(),ga=AC.createGain();
    o.type=type||'square';o.frequency.value=f;
    o.connect(ga);ga.connect(AC.destination);
    ga.gain.setValueAtTime(g||.04,t);
    ga.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

  lastFailKey=key;
  if(failedSent)return;
  failedSent=true;
  try{ if(window.parent&&window.parent!==window) window.parent.postMessage({type:'pz-failed',device:DEVICE,game:GAME_KEY,lv:LV,moves:moves},'*'); }catch(e){}
  toast(FAILQUIPS[errors%FAILQUIPS.length],true);
}
function closeAndVerify(){
  verified=true;
  $id('mask').hidden=true;
  var box=$id('captchaBox');
  box.classList.add('ok');
  $id('cbIcon').textContent='✔';$id('cbIcon').classList.remove('spin');
  $id('cbText').textContent='验证成功';
  $id('loginBtn').disabled=false;
  $id('formNote').textContent='身份已确认，欢迎回来，操作员。';
  toast('验证通过 · HUMAN VERIFIED');
}
function toast(msg,bad){
  var t=$id('toast');t.textContent=msg;t.hidden=false;
  t.className='toast'+(bad?' bad':'');
  clearTimeout(t._h);t._h=setTimeout(function(){t.hidden=true},2600);
}

/* ---------- 输入：点击涂黑 / 再点恢复 / 标记 X / 长按 ---------- */
function applyMark(x,y){
  var i=cellIdx(x,y);
  if(cells[i]===1)return false;
  marks[i]=marks[i]?0:1;
  paintCell(x,y);
  return true;
}
function applyPaint(x,y){
  var i=cellIdx(x,y);
  if(markMode){return applyMark(x,y)}
  if(cells[i]===1){cells[i]=0;marks[i]=0;paintCell(x,y);tone(200,.08,'square',.04);moves++;refreshStats();return true}
  cells[i]=1;marks[i]=0;paintCell(x,y);
  if(!pz.answer[i]){
    errors++;
    var el=$id('c-'+x+'-'+y);
    if(el){el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');el.classList.add('wrong');
      setTimeout((function(n){return function(){n.classList.remove('bad')}})(el),320);}
    tone(120,.14,'sawtooth',.05);
    toast('错涂：第 '+(y+1)+' 行第 '+(x+1)+' 列不在残影范围内 · 再点一次可恢复',true);
    onFailed();
  }else{
    tone(430+Math.random()*60,.07,'square',.05);
  }
  moves++;
  refreshHints();refreshStats();
  if(!solvedFlag&&solvedNow())onSolved();
  return true;
}
var pressTimer=null,pressed=null,longFired=false;
function onDown(e){
  if(solvedFlag)return;
  var el=e.target&&e.target.closest?e.target.closest('.cell'):null;
  if(!el)return;
  var x=+el.dataset.x,y=+el.dataset.y;
  pressed={x:x,y:y};longFired=false;
  clearTimeout(pressTimer);
  pressTimer=setTimeout(function(){
    if(!pressed)return;
    longFired=true;
    var iv=cellIdx(pressed.x,pressed.y);
    if(cells[iv]===1)cells[iv]=0;
    var ch=applyMark(pressed.x,pressed.y);
    if(!ch){paintCell(pressed.x,pressed.y)}
    refreshStats();
    tone(300,.08,'triangle',.045);
  },420);
}
function onUp(e){
  clearTimeout(pressTimer);
  if(!pressed||solvedFlag){pressed=null;return}
  var p=pressed;pressed=null;
  if(longFired){longFired=false;return}
  var el=e.target&&e.target.closest?e.target.closest('.cell'):null;
  if(!el)return;
  var x=+el.dataset.x,y=+el.dataset.y;
  if(x!==p.x||y!==p.y)return;
  applyPaint(x,y);
}
function onCancel(){clearTimeout(pressTimer);pressed=null;longFired=false}

/* ---------- 事件 ---------- */
var gridEl=$id('grid');
if(gridEl){
  gridEl.addEventListener('pointerdown',onDown);
  gridEl.addEventListener('pointerup',onUp);

$id('btnNew').addEventListener('click',function(){tone(300,.08,'triangle',.05);newChallenge()});
$id('btnMute').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇':'🔊'});
$id('loginForm').addEventListener('submit',function(e){e.preventDefault();if(verified)toast('演示环境：登录请求已放行（无后端）')});
$id('captchaBox').addEventListener('click',function(){
  if(checking)return;
  if(verified){
    verified=false;
    this.classList.remove('ok');
    $id('cbIcon').textContent='';

  }
  checking=true;
  var ic=$id('cbIcon');ic.classList.add('spin');
  $id('cbText').textContent='正在校验访问签名…';
  tone(320,.1,'triangle',.05);
  setTimeout(function(){
    checking=false;
    newChallenge();
    $id('mask').hidden=false;
    tone(440,.08,'triangle',.05);
  },700+Math.random()*300);
});

/* ---------- 自测：每档生成 1 题 + 机器验证可解/唯一/可判 ---------- */
function buildSampleLevel(p,lv){
  var shortId='lv'+lv+'-'+((p.seedUsed*2654435761)>>>0).toString(36).slice(0,6);
  var sp=specFor(lv);
  return {
    game:GAME_KEY,
    id:'nonogram-'+lv+'-'+shortId,
    lv:lv,
    name:'图形校验 V'+lv+' · '+sp.name,
    desc:'按行列校验码在 '+p.width+'×'+p.height+' 网格中涂黑格位，重建访客残影；涂黑 '+p.ones+' 格（'+p.dens+'%）。',
    play:'点击格子涂黑，再点恢复；标记模式或长按 420ms 可划 ✕（不计错）。行/列校验码为该行/该列连续黑格段长度（段间至少空一格）。涂黑格与残影不符即计一次错涂；全部吻合即通过。3★=0 错涂，2★=≤2 次，1★=完成。',
    params:{width:p.width,height:p.height,ones:p.ones,density:p.dens,seed:p.seedUsed,
            rowHint:p.rowHint,colHint:p.colHint,
            solution:p.answer.slice(),rowRuns:p.rowHint.map(function(h){return h.length}),colRuns:p.colHint.map(function(h){return h.length})},
    enabled:true
  };
}
function selftest(){
  var pass=0,i;
  for(i=1;i<=5;i++){
    var sp=specFor(i),sd=i*7919+13,ok=false,d1=null,d2=null,p=null;
    try{
      p=genPuzzle(sd,sp,{attempts:0,uniqReject:0,densRetry:0,solveReject:0});
      var v=verifyPuzzle(p);
      var vAlt=countSolutions(p.colHint,p.rowHint,p.height,p.width,2);
      var inc=0,k;
      for(k=0;k<p.answer.length;k++)if(p.answer[k])inc++;
      d1=(inc===p.ones)&&(p.ones===Math.round(p.width*p.height*p.dens/100))||(inc===p.ones&&Math.abs(p.dens-p.ones/(p.width*p.height)*100)<0.2);
      d1=(inc===p.ones);
      var zeroFilled=solvedNowOn(p,new Array(p.width*p.height).fill(0));
      var wrongFilled=solvedNowOn(p,new Array(p.width*p.height).fill(1));
      d2=(!zeroFilled)&&(!wrongFilled);
      ok=!!(v.ok&&v.unique&&p.regen.attempts>=1&&d1&&d2);
      console.log('[G7-TEST] lv'+i+' '+(ok?'PASS':'FAIL')+' — 题面 '+p.width+'×'+p.height+
        ' · 涂黑 '+p.ones+' 格（'+p.dens+'%）· 重生成 '+p.regen.attempts+' 次（唯一性拒绝 '+p.regen.uniqReject+
        ' · 降密度 '+p.regen.densRetry+'）· 唯一解确认 '+(v.unique?'是':'否')+
        ' · 答案自身即合法解 '+(v.ok?'是':'否')+' · 全空误判 '+(zeroFilled?'是':'否')+' · 全满误判 '+(wrongFilled?'是':'否')+
        ' · 交叉校验 count='+vAlt.count+' · 提示行数 '+p.rowHint.length+'/'+p.colHint.length);
      if(ok){
        pass++;
        writeSampleLevels([buildSampleLevel(p,i)]);
      }
    }catch(err){
      console.log('[G7-TEST] lv'+i+' FAIL — 异常：'+(err&&err.message?err.message:err));
    }
  }
  var pct=(pass/5*100).toFixed(1);
  console.log(pass+'/5 '+pct+'%');
  return {pass:pass,pct:pct};
}
function solvedNowOn(p,arr){
  for(var i=0;i<p.answer.length;i++)if((p.answer[i]?1:0)!==arr[i])return false;
  return true;
}

/* ---------- 导出当前局 level JSON ---------- */
function buildLevelJSON(){
  var p=pz;
  if(!p){
    var sp=specFor(LV);
    p=genPuzzle(seed,sp,{attempts:0,uniqReject:0,densRetry:0,solveReject:0});
  }
  return buildSampleLevel(p,LV);
}
function doExport(){
  var lvl=buildLevelJSON();
  console.log('[EXPORT] '+JSON.stringify(lvl));
  return lvl;
}
function onReady(){
  console.log('[G7-INIT] {lv:'+LV+',w:'+specFor(LV).w+',h:'+specFor(LV).h+',seed:'+seed+',custom:'+customLevels.length+'}');
  if(qs.get('export')==='1')doExport();
}

/* ---------- 启动 ---------- */
function bootChallenge(){
  try{ customLevels=readCustomLevels() }catch(e){ customLevels=[] }
  queuedLevel=pickQueuedLevel(LV);
  renderDiffBar();
  newChallenge();
  onReady();
}

if(qs.get('direct')==='1'){

  bootChallenge();
