<style>
html{-webkit-tap-highlight-color:transparent}

:root{--bg:#0b0e11;--line:#28313b;--line2:#3a4550;--ink:#d9e0e7;--dim:#8a96a2;--acc:#ffb100;--on:#ffcb4a;--ok:#3ddc8f;--bad:#ff5252;--cy:#39d0e0;--mono:ui-monospace,Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1000px 520px at 75% -10%,rgba(255,177,0,.07),transparent 60%),var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,'Microsoft YaHei',sans-serif;overflow-x:hidden;padding:24px 12px}
.bg{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:42px 42px;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at center,black 25%,transparent 78%);mask-image:radial-gradient(ellipse at center,black 25%,transparent 78%)}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:99;background-image:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px);background-size:100% 3px}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.frame{position:relative}
.frame::after{content:"";position:absolute;inset:6px;border:1px dashed rgba(255,177,0,.16);border-radius:10px;pointer-events:none}
.card{width:min(92vw,420px);background:linear-gradient(180deg,#161c23,#12171d);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
.hazard{height:8px;background:repeating-linear-gradient(45deg,var(--acc) 0 12px,#141414 12px 24px);opacity:.85}
.brand{display:flex;gap:12px;align-items:center;padding:18px 22px 6px}
.logo{width:40px;height:40px;border:1px solid var(--acc);border-radius:8px;display:grid;place-items:center;color:var(--acc);font-size:20px;box-shadow:inset 0 0 12px rgba(255,177,0,.25)}
.brand h1{font-size:17px;letter-spacing:.14em}

form{padding:10px 22px 22px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:.1em}
.field input{width:100%;background:#0e1318;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font-size:14px;outline:none}

.stamp{position:absolute;inset:0;background:rgba(8,11,13,.87);display:flex;align-items:center;justify-content:center;z-index:5;animation:fade .25s}

.tick{font-size:40px;line-height:1}
.stamp-box h3{margin-top:6px;letter-spacing:.22em;font-size:18px}
.stamp-box p{margin-top:8px;font-size:11px;color:var(--ink);opacity:.85;line-height:1.6}
@keyframes stampIn{from{transform:rotate(-6deg) scale(1.6);opacity:0}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#161d24;border:1px solid var(--acc);color:var(--ink);padding:10px 18px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fade .2s;max-width:88vw;text-align:center}
/* == craft patch: impeccable x industrial-telemetry == */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:640px){.mfoot{flex-wrap:wrap;gap:8px}.mtip{font-size:12px}.stats{font-size:11px;gap:8px}.card{padding:0}.board{width:88vw}.stamp-box{padding:16px 20px}.tile .num{font-size:clamp(14px,5.8vw,22px)}}
</style>

<script>
'use strict';
/* ---------- 基础工具 ---------- */
function $id(s){return document.getElementById(s)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 参数 ---------- */
var qs=new URLSearchParams(location.search);
var DEVICE='V-40061', GAME='sliding';
var LV_TABLE={
  1:{n:3,k:80,name:'简单',tip:'3×3 · 打乱 80 步'},
  2:{n:3,k:150,name:'容易',tip:'3×3 · 打乱 150 步'},
  3:{n:4,k:120,name:'中等',tip:'4×4 · 打乱 120 步'},
  4:{n:4,k:200,name:'较难',tip:'4×4 · 打乱 200 步'},
  5:{n:4,k:300,name:'困难',tip:'4×4 · 打乱 300 步'}
};
var LEVELS_META=[1,2,3,4,5].map(function(k){return {game:GAME,lv:k,n:LV_TABLE[k].n,k:LV_TABLE[k].k,name:LV_TABLE[k].name}});
var CUSTOM_KEY='endland-levels-'+GAME;
var seed=parseInt(qs.get('seed')||'',10); if(isNaN(seed))seed=((Date.now()%1000000)|0)+1;
var DEBUG=qs.get('debug')==='1';
function clampLv(v){v=parseInt(v,10);if(isNaN(v))return 1;return Math.max(1,Math.min(5,v))}
var lvRaw=qs.get('lv');
var LV=clampLv(lvRaw===null||lvRaw===''?1:lvRaw);

/* ---------- 状态 ---------- */
var pz=null, board=[], moves=0, t0=0, timerId=null, solvedFlag=false, verified=false, muted=false, checking=false, dragging=false, dragFrom=-1, dragStart=null, started=false, lastMistakes=0;
var ST={genRetry:0,scrambleReject:0};
var customLevels=[],queuedLevel=null,solvedStats=null;

function readCustomLevels(){
  var arr=[],raw=null;
  try{raw=localStorage.getItem(CUSTOM_KEY)}catch(e){raw=null}
  if(!raw)return arr;
  try{
    var parsed=JSON.parse(raw);
    if(Object.prototype.toString.call(parsed)==='[object Array]'){
      for(var i=0;i<parsed.length;i++){
        var it=parsed[i];
        if(!it||typeof it!=='object')continue;
        if(it.enabled===false)continue;
        if(it.game&&it.game!==GAME)continue;
        if(it.lv===undefined||it.lv===null)continue;
        arr.push(it);
      }
    }
  }catch(e){}
  return arr;
}
function pickQueuedLevel(lv){
  for(var i=0;i<customLevels.length;i++){
    var it=customLevels[i];
    if(clampLv(it.lv)!==lv)continue;
    if(!it.params||!it.params.n)continue;
    return it;
  }
  return null;
}

/* ---------- 盘面模型 ---------- */
function goalBoard(n){var a=[],i;for(i=1;i<n*n;i++)a.push(i);a.push(0);return a}
function isSolved(a){for(var i=0;i<a.length-1;i++){if(a[i]!==i+1)return false}return a[a.length-1]===0}
function moveList(a,n){
  var z=a.indexOf(0),zx=z%n,zy=(z/n)|0,out=[],d,nx,ny;
  for(d=0;d<4;d++){
    nx=zx+[1,-1,0,0][d];ny=zy+[0,0,1,-1][d];
    if(nx<0||ny<0||nx>=n||ny>=n)continue;
    out.push(ny*n+nx);
  }
  return out;
}
function applyMove(a,n,j){var z=a.indexOf(0);a[z]=a[j];a[j]=0;return a}
function neighbors(a,n){return moveList(a,n).map(function(j){return applyMove(a.slice(),n,j)})}
/* 打乱：随机走 k 步，不立即回退上一步（天然可解） */
function scramble(n,k,rng){
  var a=goalBoard(n),prev=-1,i,z,cand,pick;
  for(i=0;i<k;i++){
    z=a.indexOf(0);
    cand=moveList(a,n).filter(function(j){return j!==prev});
    if(!cand.length)cand=moveList(a,n);
    pick=cand[Math.floor(rng()*cand.length)];
    applyMove(a,n,pick);prev=z;
  }
  return a;
}
/* 逆序回放：把每一步空位移动真正取反（to->from），应精确回到目标态 -> 证明可解 */
function replayVerify(start,pathSoFar,n){
  var a=start.slice(),i,m;
  for(i=pathSoFar.length-1;i>=0;i--){
    m=pathSoFar[i];
    a[m.to]=a[m.from];a[m.from]=0;
  }
  return isSolved(a);
}
/* 带路径的打乱：记录每一步空位的 from->to，供逆序回放校验 */
function scrambleWithPath(n,k,rng){
  var a=goalBoard(n),path=[],prev=-1,i,z,cand,pick;
  for(i=0;i<k;i++){
    z=a.indexOf(0);
    cand=moveList(a,n).filter(function(j){return j!==prev});
    if(!cand.length)cand=moveList(a,n);
    pick=cand[Math.floor(rng()*cand.length)];
    path.push({from:z,to:pick});
    applyMove(a,n,pick);prev=z;
  }
  return {board:a,path:path};
}
/* 反向 BFS：目标态出发算到给定态的最短距离（仅 3×3 用，9!/2=181440 态） */
var BFS3=null;
function bfs3(){
  if(BFS3)return BFS3;
  var n=3,start=goalBoard(n),map={},front=[start],k,d,next,i;
  map[start.join(',')]=0;
  while(front.length){
    next=[];
    for(i=0;i<front.length;i++){
      var st=front[i],d0=map[st.join(',')],nb=neighbors(st,n);
      for(d=0;d<nb.length;d++){
        k=nb[d].join(',');
        if(map[k]===undefined){map[k]=d0+1;next.push(nb[d])}
      }
    }
    front=next;
  }
  BFS3=map;return map;
}
function optimal3(a){var m=bfs3();var v=m[a.join(',')];return v===undefined?-1:v}

/* ---------- 生成：打乱即生成态，天然可解 ---------- */
function genFor(lvSpec,sd){
  var n=lvSpec.n,k=lvSpec.k,base=pz;
  for(var att=0;att<200;att++){
    var rng=mulberry32(((sd*2654435761)^((att+1)*40503))>>>0);
    var r=scrambleWithPath(n,k,rng);
    if(isSolved(r.board)){ST.scrambleReject++;continue}
    if(!replayVerify(r.board,r.path,n)){ST.scrambleReject++;continue}
    pz=base;
    return {n:n,k:k,lv:0,board:r.board,path:r.path.slice(),seedUsed:sd,att:att};
  }
  pz=base;
  if(++ST.genRetry>50)return null;
  return genFor(lvSpec,sd+1);
}

/* ---------- 渲染 ---------- */
function tileIndex(el){return parseInt(el.getAttribute('data-i'),10)}
function buildBoard(){
  var b=$id('board'),i,n=pz.n,cell,v,el;
  b.innerHTML='';
  cell='calc((100% - '+(6*(n-1))+'px) / '+n+')';
  b.style.gridTemplateColumns='repeat('+n+',1fr)';
  b.style.gridTemplateRows='repeat('+n+',1fr)';
  for(i=0;i<n*n;i++){
    v=board[i];
    if(v===0){
      el=document.createElement('div');
      el.className='tile';
      el.setAttribute('data-i',i);
      el.setAttribute('data-empty','1');
      el.style.background='#0a0e12';
      el.style.border='1px dashed rgba(255,177,0,.18)';
      el.style.cursor='default';
      b.appendChild(el);
      continue;
    }
    el=document.createElement('div');
    el.className='tile';
    el.setAttribute('data-i',i);
    el.setAttribute('data-v',v);
    el.setAttribute('role','gridcell');
    el.setAttribute('aria-label','碎片 '+v+'，第 '+(Math.floor(i/n)+1)+' 行第 '+(i%n+1)+' 列');
    el.innerHTML='<span class="frag">'+fragSVG(v)+'</span><span class="num">'+v+'</span>';
    b.appendChild(el);
  }
  paintMovable();
}
/* 影像碎片：按编号切出一块位图肌理，还原后拼成完整影像 */
function fragSVG(v){
  var a=(v*37)%11,b=(v*53)%7,s='';
  s+='<i style="left:0;top:'+(a*9%80)+'%;width:100%;height:2px"></i>';
  s+='<i style="left:'+(b*12%80)+'%;top:0;width:2px;height:100%"></i>';
  s+='<i style="left:0;bottom:'+((v*17)%70)+'%;width:'+(30+a*4)+'%;height:3px"></i>';
  return s;
}
function paintMovable(){
  var b=$id('board'),cells=b.children,i,el,j,ok,n=pz.n;
  var z=board.indexOf(0),moves_=moveList(board,n);
  for(i=0;i<cells.length;i++){
    el=cells[i];
    j=tileIndex(el);
    ok=false;
    for(var q=0;q<moves_.length;q++)if(moves_[q]===j)ok=true;
    if(el.getAttribute('data-empty')==='1'){el.className='tile';continue}
    el.className='tile'+(ok?' movable':'')+(board[j]===j+1?' home':'');
  }
}

var AC=null;
function tone(f,d,type,g,when){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var t=AC.currentTime+(when||0),o=AC.createOscillator(),ga=AC.createGain();
    o.type=type||'square';o.frequency.value=f;
    o.connect(ga);ga.connect(AC.destination);
    ga.gain.setValueAtTime(g||.04,t);
    ga.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

function specFor(lv){
  var s=LV_TABLE[lv],n=s.n,k=s.k,custom=false;
  if(queuedLevel&&queuedLevel.params){
    if(queuedLevel.params.n)n=Math.max(2,Math.min(6,parseInt(queuedLevel.params.n,10)||s.n));
    if(queuedLevel.params.k)k=Math.max(1,Math.min(2000,parseInt(queuedLevel.params.k,10)||s.k));
    custom=true;
  }
  return {n:n,k:k,name:s.name,custom:custom,ref:0};
}
function newChallenge(){
  solvedFlag=false;
  if(!DEBUG){seed=((seed*1103515245+12345)%1000000007)|0;if(seed<0)seed=-seed;if(!seed)seed=1}
  var spec=specFor(LV);

  if(!pz){pz={n:3,k:80,lv:LV,board:goalBoard(3),path:[],seedUsed:seed,att:0};pz.board=scramble(3,80,mulberry32(7))}
  pz.lv=LV;
  /* 最短参考：3×3 用反向 BFS 精确解；4×4 用打乱步 k（规格指定） */
  if(pz.n===3){var o=optimal3(pz.board);pz.ref=o>=0?o:pz.k}
  else pz.ref=pz.k;

  $id('mStatus').textContent='接入中…';$id('mStatus').classList.remove('pass');

}
function doMove(j,src){
  if(solvedFlag)return false;
  var z=board.indexOf(0),n=pz.n,ok=false,i,ml=moveList(board,n);
  for(i=0;i<ml.length;i++)if(ml[i]===j)ok=true;
  if(!ok){tone(150,.09,'sawtooth',.04);return false}
  applyMove(board,n,j);
  moves++;
  var mEl=$id('stMoves');
  mEl.textContent='步数 '+moves;
  mEl.className=moves>Math.ceil(pz.ref*1.5)?'over':'';
  var cells=$id('board').children,el;
  /* 空格此时在 j（applyMove 之后），方块落到了原空格 z：两者曾写反，导致方块消失+幽灵 0 且不可点 */
  for(i=0;i<cells.length;i++){el=cells[i];if(tileIndex(el)===j){el.setAttribute('data-empty','1');el.setAttribute('data-v','0');el.innerHTML='';el.style.background='#0a0e12';el.style.border='1px dashed rgba(255,177,0,.18)';break}}
  for(i=0;i<cells.length;i++){el=cells[i];if(tileIndex(el)===z){el.setAttribute('data-empty','0');el.setAttribute('data-v',board[z]);el.innerHTML='<span class="frag">'+fragSVG(board[z])+'</span><span class="num">'+board[z]+'</span>';el.style.background='';el.style.border='';break}}
  var moved=null;
  for(i=0;i<cells.length;i++)if(tileIndex(cells[i])===z){moved=cells[i];break}
  if(moved){moved.classList.remove('pop');void moved.offsetWidth;moved.classList.add('pop')}
  tone(src==='drag'?300:380+Math.random()*60,.06,'square',.045);
  paintMovable();
  if(isSolved(board))onSolved();
  return true;
}

/* ---------- 自检：同步执行，不起定时器 ---------- */
function selftest(){
  var t0s=(function(){try{return performance.now()}catch(e){return Date.now()}})();
  var pass=0,rows=[],v,i,r;
  var LV_TARGET={1:{n:3,k:80},2:{n:3,k:150},3:{n:4,k:120},4:{n:4,k:200},5:{n:4,k:300}};
  for(v=1;v<=5;v++){
    var spec={n:LV_TARGET[v].n,k:LV_TARGET[v].k,lv:v};
    var sd=v*7919+101;
    var p=genFor(spec,sd);
    var notes=[],ok=true;
    if(!p){ok=false;notes.push('生成失败')}
    else{
      /* A. 逆序回放：沿打乱路径反走可回到目标态 -> 可解 */
      var rev=replayVerify(p.board,p.path,p.n);
      if(!rev){ok=false;notes.push('逆序回放不成立')}
      notes.push('逆序回放='+(rev?'可解':'不可解')+'('+p.path.length+'步)');
      /* B. 目标态一致性 + 空位唯一 */
      var zeros=p.board.filter(function(x){return x===0}).length;
      var set={},dup=0,oob=0;
      for(i=0;i<p.board.length;i++){var val=p.board[i];if(val<0||val>p.n*p.n-1)oob++;if(set[val])dup++;set[val]=1}
      if(zeros!==1||dup||oob){ok=false;notes.push('盘面非法')}
      notes.push('空位='+zeros+' 重复='+dup+' 越界='+oob);
      notes.push('已还原='+(isSolved(p.board)?'是':'否'));
      if(isSolved(p.board)){ok=false;notes.push('打乱后即为目标态')}
      /* C. 3×3：反向 BFS 验证最短解存在且 ≤k */
      if(p.n===3){
        var opt=optimal3(p.board);
        notes.push('BFS最短='+opt);
        if(opt<0){ok=false;notes.push('BFS不可达')}
        else if(opt>p.k){ok=false;notes.push('最短解 '+opt+' > k '+p.k)}
        else notes.push('最短解≤k ✔');
      }else{
        notes.push('4×4 用逆序回放验证可解 ✔');
      }
      /* D. 判定器：按解路径回放应判定通关 */
      var sim=p.board.slice();
      for(i=p.path.length-1;i>=0;i--){var mm=p.path[i];sim[mm.to]=sim[mm.from];sim[mm.from]=0}
      if(!isSolved(sim)){ok=false;notes.push('回放判定失败')}
      notes.push('回放判定='+(isSolved(sim)?'通过':'失败')+'('+p.path.length+'步逆序)');
    }
    p=genFor(spec,sd);
    var refStr=p?(p.n===3?String(optimal3(p.board)):String(p.k)):'-';
    rows.push({lv:v,n:LV_TARGET[v].n,k:LV_TARGET[v].k,ref:refStr,ok:ok,notes:notes});
    if(ok)pass++;
  }
  for(i=0;i<rows.length;i++){
    r=rows[i];
    console.log('[G9-TEST] lv'+r.lv+' '+(r.ok?'PASS':'FAIL')+' · '+r.n+'×'+r.n+'/k='+r.k+'/ref='+r.ref+' · '+r.notes.join(' · '));
  }
  var ms=(function(){try{return performance.now()}catch(e){return Date.now()}})()-t0s;
  console.log('[G9-TEST] 汇总 '+pass+'/5 '+(pass/5*100).toFixed(1)+'% · 逆序回放+反向BFS 校验 · 耗时 '+ms.toFixed(0)+'ms · 生成重试 '+ST.genRetry+' · 打乱拒绝 '+ST.scrambleReject);
  return {pass:pass,total:5,rows:rows,ms:ms};
}

/* 静音持久化：九关共享同一个键 endland-mute（跨关、跨刷新记住用户选择；默认仍为有声） */
(function(){
  try{
    if(localStorage.getItem('endland-mute')==='on')muted=true;
    var b=document.getElementById('btnMute');
    if(!b)return;
    if(muted)b.textContent='🔇';
    b.addEventListener('click',function(){try{localStorage.setItem('endland-mute',muted?'on':'off')}catch(e){}});
window.addEventListener('storage',function(e){if(e.key==='endland-mute'){muted=(e.newValue==='on');var mb2=document.getElementById('btnMute');if(mb2)mb2.textContent=muted?'🔇':'🔊';}});
  }catch(e){}
})();
</script>
